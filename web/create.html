<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speak it into being</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/paint.css">
<style>
  /* creation playground: voice -> the world. The full game UI lives in web/js/ui; this is deliberately bare. */
  .editions, .tweaks-toggle, .tweaks, .closeup { display: none !important; }
  .serif { font-family: "Instrument Serif", Georgia, serif; color: var(--ink); }
  #caption { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); max-width: min(900px, calc(100vw - 32px)); text-align: center;
    font-size: clamp(22px, 2.6vw, 34px); font-style: italic; line-height: 1.15; text-shadow: 0 1px 0 rgba(243,236,220,.9), 0 0 18px rgba(243,236,220,.85);
    opacity: 0; transition: opacity .5s; pointer-events: none; }
  #caption.on { opacity: 1; }
  #caption .dim { opacity: .55; }
  #mic { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; font-size: 15px; font-style: italic;
    padding: 6px 14px 7px 10px; border-radius: 999px; background: color-mix(in srgb, var(--paper) 82%, transparent); box-shadow: 0 0 0 1px rgba(61,85,136,.18); cursor: pointer; user-select: none; }
  #mic i { width: 10px; height: 10px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px rgba(224,80,63,.18); transition: transform .2s; }
  #mic.listening i { transform: scale(1.5); animation: pulse 0.9s ease-in-out infinite; }
  #mic.thinking i { background: var(--ink); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(224,80,63,0); } }
  #mic input { display: none; font: inherit; font-style: italic; font-size: 17px; color: var(--ink); background: none; border: 0; border-bottom: 1px solid rgba(61,85,136,.4); outline: none; width: min(460px, 60vw); }
  #mic.typing input { display: block; } #mic.typing span { display: none; }
  #notice { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); text-align: center; font-size: 17px; opacity: 0; transition: opacity .5s; pointer-events: none;
    text-shadow: 0 0 14px rgba(243,236,220,.95); max-width: calc(100vw - 32px); }
  #notice.on { opacity: 1; }
  #notice small { display: block; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; opacity: .6; margin-bottom: 3px; }
  #notice em { display: block; font-size: 14px; opacity: .7; }
  #hint { position: fixed; left: 22px; top: 20px; font-size: 15px; font-style: italic; opacity: .75; line-height: 1.5; text-shadow: 0 0 12px rgba(243,236,220,.9); }
  #hint b { font-weight: 400; font-style: normal; }
  #mind { position: fixed; right: 22px; top: 22px; font-size: 13px; font-style: italic; opacity: .6; }
</style>
</head>
<body>
<div id="hint" class="serif">Hold <b>Space</b> and speak, or press <b>Enter</b> to write.<br>Click the ground to mark a spot ✕, then say “a house here”. Esc clears it.<br><span style="opacity:.75">try: “a house in the middle” · “a windmill there” · “a giant rubber duck” · “a lighthouse on the cliff”</span></div>
<div id="mind" class="serif"></div>
<div id="notice" class="serif"></div>
<div id="caption" class="serif"></div>
<svg id="markX" width="26" height="26" viewBox="0 0 26 26" style="position:fixed;left:0;top:0;pointer-events:none;display:none;transform:translate(-50%,-50%)"><path d="M5 6 L21 20 M20 5 L6 21" stroke="#4a4550" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".85"/></svg>
<div id="mic" class="serif"><i></i><span>hold Space</span><input id="typed" placeholder="say what to build…" autocomplete="off"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/Reflector.js"></script>
<script type="module">
import { createRenderer, createContext } from './js/paint/context.js';
import { createBackdrop } from './js/paint/backdrop.js';
import { createKit } from './js/paint/kit.js';
import { createFolk } from './js/paint/folk.js';
import { createPainter } from './js/paint/post.js';
import { createBuildApi } from './js/buildings/api.js';
import { createLibrary } from './js/buildings/library.js';
import { createReveal } from './js/buildings/reveal.js';
import { renderSketchFromMassing } from './js/buildings/sketch.js';
import { createVoice } from './js/voice/voice.js';
import { createApi } from './js/net/api.js';
import { createGame } from './js/sim/state.js';

const $ = id => document.getElementById(id);
const net = createApi();
const game = createGame({ seed: 7 });
const renderer = createRenderer();
const scene = new THREE.Scene();
const camBase = new THREE.Vector3(0, 40, 46);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.5, 1600);
const ctx = createContext({ renderer, scene, camera, seed: 7 });
const { V, R } = ctx;
const kit = createKit(ctx);
const backdrop = createBackdrop(ctx, { camBase });
const api = createBuildApi(ctx, kit, { keyDir: backdrop.KEY_DIR });
const lib = createLibrary(ctx, kit, { api });

// cream paper ground (the real relief world replaces this in the game)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(420, 300), new THREE.MeshLambertMaterial({ color: 0xe9dcc8 }));
ground.rotation.x = -Math.PI / 2; ground.position.z = 60; ground.receiveShadow = true; scene.add(ground);

// folk who come running to every creation
const HALF = 30, obstacles = [];
const nav = {
  obstacles, spots: [[-4, 6], [3, 8], [0, 4], [-7, 9], [7, 5], [5, 11], [-3, 12], [2, 2]], closeFocus: V(0, 1.1, 6),
  pickTarget(a) { a.path = [V(R(-18, 18), 0, R(-10, 18))]; },
  bounds(p) { p.x = Math.max(-HALF, Math.min(HALF, p.x)); p.z = Math.max(-24, Math.min(26, p.z)); },
  extraPush() {}, flyTarget(f) { f.route = [V(R(-16, 16), R(4, 9), R(-8, 14))]; }, floatTarget(f) { f.route.push(V(R(-16, 16), R(5, 9), R(-8, 14))); },
  flyPush() {}, onArrive() {}
};
const folk = createFolk(ctx, backdrop, nav);
const walkers = [folk.make.puffer(0), folk.make.puffer(1), folk.make.puffer(2), folk.make.pip(3), folk.make.drop(4), folk.make.loaf(5), folk.make.scoot(6), folk.make.pip(7)];
folk.make.flit(8); folk.make.flit(9); folk.make.floatie(10);
folk.update(0.016, 0);
const painter = createPainter(ctx, folk, { framing: (cam, w, h) => { cam.aspect = w / h; cam.fov = w / h < 1 ? 52 : 38; } });
addEventListener('resize', () => painter.resize());
painter.setMode(1);   // gouache only
painter.resize();

// ---------- bird's-eye leader camera ----------
const rig = { yaw: -0.18, pitch: 0.86, dist: 46, target: V(0, 0, 4), goal: null };
function placeCam(dt) {
  if (rig.goal) { const k = 1 - Math.pow(0.12, dt); rig.target.lerp(rig.goal.t, k); rig.dist += (rig.goal.d - rig.dist) * k; if (rig.target.distanceTo(rig.goal.t) < 0.05) rig.goal = null; }
  const { yaw, pitch, dist, target } = rig;
  camera.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(target);
}
{ let drag = null; const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw: rig.yaw, pitch: rig.pitch, t: rig.target.clone(), right: e.button === 2 || e.shiftKey }; el.setPointerCapture(e.pointerId); });
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('pointermove', e => { if (!drag) return; rig.goal = null;
    if (drag.right) { rig.yaw = drag.yaw - (e.clientX - drag.x) * 0.005; rig.pitch = Math.max(0.35, Math.min(1.45, drag.pitch + (e.clientY - drag.y) * 0.003)); }
    else { const s = rig.dist * 0.0016, c = Math.cos(rig.yaw), sn = Math.sin(rig.yaw), dx = -(e.clientX - drag.x) * s, dz = -(e.clientY - drag.y) * s;
      rig.target.set(drag.t.x + dx * c + dz * sn, 0, drag.t.z - dx * sn + dz * c); }
    painter.markDirty(); });
  el.addEventListener('pointerup', e => { if (drag && !drag.right && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 5) { mark = pick(e.clientX, e.clientY); $('markX').style.display = mark ? 'block' : 'none'; } drag = null; });
  el.addEventListener('wheel', e => { rig.goal = null; rig.dist = Math.max(10, Math.min(140, rig.dist * Math.exp(e.deltaY * 0.001))); painter.markDirty(); }, { passive: true });
}
let mark = null;
addEventListener('keydown', e => { if (e.key === 'Escape') { mark = null; $('markX').style.display = 'none'; } });
const ray = new THREE.Raycaster(), plane = new THREE.Plane(V(0, 1, 0), 0);
function pick(cx, cy) {
  ray.setFromCamera({ x: cx / innerWidth * 2 - 1, y: -(cy / innerHeight) * 2 + 1 }, camera);
  const p = new THREE.Vector3(); return ray.ray.intersectPlane(plane, p) ? { x: +p.x.toFixed(2), z: +p.z.toFixed(2) } : null;
}

// ---------- the world's creations ----------
const placed = [];   // { x, z, r, obj, name }
function freeSpot(want, r) {
  for (let i = 0; i < 400; i++) {
    const a = i * 2.39996, d = i === 0 ? 0 : 1.6 + Math.sqrt(i) * 1.9;
    const x = want.x + Math.cos(a) * d, z = want.z + Math.sin(a) * d;
    if (placed.every(p => Math.hypot(p.x - x, p.z - z) > p.r + r + 0.8)) return { x, z };
  }
  return want;
}
function whereFor(at, pointer) {
  if (mark && pointer === mark && !(at && at.mode === 'center')) return pointer;
  const last = placed[placed.length - 1];
  if (!at || at.mode === 'center' || at.mode === 'auto') return at && at.mode === 'auto' && last ? { x: last.x + 9, z: last.z } : { x: 0, z: 2 };
  if (at.mode === 'pointer') return pointer || { x: 0, z: 2 };
  if (at.mode === 'near' && at.ref) { const ref = placed.find(p => p.id === at.ref || (p.kind && p.kind === at.ref)); if (ref) return { x: ref.x + ref.r + 4, z: ref.z }; }
  if (at.ref === 'water' || at.ref === 'edge') return { x: R(-10, 10), z: -16 };
  if (typeof at.x === 'number') return { x: at.x, z: at.z };
  return pointer || { x: R(-8, 8), z: R(-2, 8) };
}
function rush(x, z) { walkers.forEach((a, i) => { const ang = i / walkers.length * Math.PI * 2; a.path = [V(x + Math.cos(ang) * 5, 0, z + Math.sin(ang) * 5)]; a.wait = 0; }); }
function focusOn(x, z, size) { rig.goal = { t: V(x, 0, z), d: Math.max(26, Math.min(70, size * 4.5 + 18)) }; }
async function materialise(obj, x, z, { sketchS = 1.0, paintS = 3.6 } = {}) {
  obj.position.set(x, 0, z); scene.add(obj);
  const r = createReveal(ctx, obj, {}); r.hide(); painter.markDirty();
  await r.sketch(sketchS); await wait(350); await r.paint(paintS); r.done(); painter.markDirty();
  return r;
}
const wait = ms => new Promise(res => setTimeout(res, ms));
function sizeOf(obj) { const s = obj.userData.agora && obj.userData.agora.size; return s ? Math.max(s.w, s.d) : 5; }
function record(obj, x, z, kind, name) { const r = sizeOf(obj) * 0.5; placed.push({ id: 'b' + placed.length, x, z, r, obj, kind, name }); obstacles.push([x, z, r + 0.5]); }

let noticeT = null;
function notice(kicker, text, sub = '', ms = 0) { const n = $('notice'); n.innerHTML = `<small>${kicker}</small>${text}${sub ? `<em>${sub}</em>` : ''}`; n.classList.add('on'); clearTimeout(noticeT); if (ms) noticeT = setTimeout(() => n.classList.remove('on'), ms); }
function caption(text, dim = false) { const c = $('caption'); c.innerHTML = dim ? `<span class="dim">${text}</span>` : text; c.classList.add('on'); }
let capT = null; const capOff = (ms = 3200) => { clearTimeout(capT); capT = setTimeout(() => $('caption').classList.remove('on'), ms); };
const mic = $('mic'), setMic = s => { mic.className = 'serif ' + s; };

async function buildKnown(kind, at, pointer, name) {
  const obj = lib.create(kind, { variant: placed.length % 3 });
  const w = whereFor(at, pointer), p = freeSpot(w, sizeOf(obj) * 0.5);
  record(obj, p.x, p.z, kind, name || kind); focusOn(p.x, p.z, sizeOf(obj)); rush(p.x, p.z);
  notice('the folk', `${name || kind[0].toUpperCase() + kind.slice(1)}: the site is marked.`, '', 4000);
  await materialise(obj, p.x, p.z);
}
async function buildNew(request, at, pointer, name) {
  const label = name || request;
  const w = whereFor(at, pointer), p = freeSpot(w, 4);
  focusOn(p.x, p.z, 8); rush(p.x, p.z);
  notice('Ministry of Builds', `We have never built ${request.replace(/^(a|an|the)\s+/i, 'a ')}. Plans are being drawn.`, 'the builders sharpen their pencils');
  const t0 = performance.now();
  let sketchObj = null, sketchReveal = null;
  const sketchP = net.sketch({ request, snapshot: game.snapshot() }).then(m => {
    if (!m || !m.parts || finalIn) return;
    sketchObj = renderSketchFromMassing(api, m); sketchObj.position.set(p.x, 0, p.z); scene.add(sketchObj);
    sketchReveal = createReveal(ctx, sketchObj, {}); sketchReveal.hide(); sketchReveal.sketch(1.4); painter.markDirty();
    notice('Ministry of Builds', `A first sketch of ${label}.`, `drawn in ${((performance.now() - t0) / 1000).toFixed(1)} s · the real plans are being inked`);
  }).catch(() => {});
  let finalIn = false;
  const asset = await new Promise(res => net.codegen({ request, kindHint: null, snapshot: game.snapshot() }, {
    onStatus: s => notice('Ministry of Builds', `Plans for ${label}.`, s.note || s.stage),
    onDone: a => res(a), onError: e => { console.warn('codegen', e); res(null); }
  }));
  finalIn = true; await sketchP;
  let obj = null;
  if (asset && asset.code) { const reg = lib.register(asset); if (reg.ok) obj = lib.create(reg.id); else console.warn('register failed', reg.error); }
  const secs = ((performance.now() - t0) / 1000).toFixed(0);
  if (!obj && sketchObj) {   // never fail visibly: paint the sketch itself
    notice('Ministry of Builds', `${label}: built from the sketch.`, '', 5000);
    await sketchReveal.paint(3.6); sketchReveal.done(); record(sketchObj, p.x, p.z, null, label); return;
  }
  if (!obj) { notice('Ministry of Builds', `The plans for ${label} fell apart. Try again?`, '', 5000); return; }
  if (sketchObj) { scene.remove(sketchObj); }
  notice('Ministry of Builds', `${asset.name || label}: the plans are ready.`, `designed by Opus in ${secs} s`, 6000);
  const q = freeSpot(p, sizeOf(obj) * 0.5); record(obj, q.x, q.z, null, asset.name || label);
  await materialise(obj, q.x, q.z, { sketchS: 0.8 });
}

async function handle(text, pointer) {
  const usedMark = mark; if (mark) pointer = mark;
  setMic('thinking'); caption(`“${text}”`);
  walkers.forEach(a => { a.lookViewer = true; a.wait = Math.max(a.wait, 1.5); });
  let res;
  try { res = await net.command({ transcript: text, pointer, snapshot: Object.assign(game.snapshot(), { scene: 'earth', creations: placed.slice(-4).map(p => ({ id: p.id, name: p.name, x: +p.x.toFixed(1), z: +p.z.toFixed(1) })) }) }); }
  catch (e) { setMic(''); caption('The folk could not hear that. Try again?', true); capOff(); return; }
  setMic(''); capOff(2600);
  const mind = res.meta && res.meta.mind; $('mind').textContent = mind === 'mock' ? 'offline mind' : mind ? 'Claude is listening' : '';
  if (res.say && res.say.text && !(res.actions || []).some(a => a.type === 'build')) notice(res.say.from === 'minister' ? 'the minister' : 'the folk', res.say.text, '', 5000);
  for (const a of res.actions || []) {
    if (a.type !== 'build') continue;
    const n = Math.max(1, Math.min(4, a.count || 1));
    for (let i = 0; i < n; i++) {
      if (i === n - 1 && usedMark === mark) { setTimeout(() => { if (mark === usedMark) { mark = null; $('markX').style.display = 'none'; } }, 1500); }
      if (a.kind && lib.has(a.kind)) buildKnown(a.kind, i ? { mode: 'auto' } : a.at, pointer, a.name);
      else buildNew(a.request || a.name || text, a.at, pointer, a.name);
      await wait(500);
    }
  }
}

// ---------- voice + typing ----------
const voice = createVoice({
  onStart: () => { setMic('listening'); caption('…', true); },
  onPartial: t => caption(t, true),
  onFinal: (t, meta) => { const pt = meta && (meta.pointerAtThere || meta.pointerAtEnd || meta.pointerAtStart); if (t && t.trim()) handle(t.trim(), pt ? pick(pt.x, pt.y) : null); else { setMic(''); capOff(0); } },
  onError: e => { setMic(''); caption(e.message || 'microphone trouble — press Enter to write instead', true); capOff(); }
});
let lastPointer = { x: innerWidth / 2, y: innerHeight / 2 };
addEventListener('pointermove', e => { lastPointer = { x: e.clientX, y: e.clientY }; });
const typed = $('typed');
addEventListener('keydown', e => {
  if (document.activeElement === typed) {
    if (e.key === 'Enter' && typed.value.trim()) { const v = typed.value.trim(); typed.value = ''; typed.blur(); mic.classList.remove('typing'); handle(v, pick(lastPointer.x, lastPointer.y)); }
    if (e.key === 'Escape') { typed.blur(); mic.classList.remove('typing'); }
    return;
  }
  if (e.key === 'Enter' || e.key === '/') { e.preventDefault(); mic.classList.add('typing'); typed.focus(); }
});
mic.addEventListener('click', () => { mic.classList.add('typing'); typed.focus(); });
if (!voice.supported) $('hint').firstChild.textContent = voice.unsupportedMessage + ' ';

net.health().then(h => { $('mind').textContent = h.mock ? 'offline mind' : 'Claude is listening'; }).catch(() => { $('mind').textContent = 'no server'; });
await lib.load();
try { (await net.assets()).forEach(a => lib.register(a)); } catch {}
painter.markDirty();
window.__create = { handle, lib, placed, painter };

const clock = new THREE.Clock();
(function frame() {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  folk.update(dt, t);
  painter.frame(dt, t, tt => { placeCam(dt); backdrop.update(tt); lib.update(tt); });
  if (rig.goal) painter.markDirty();
  if (mark) { const v = new THREE.Vector3(mark.x, 0, mark.z).project(camera); const X = $('markX'); X.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; X.style.top = ((1 - v.y) / 2 * innerHeight) + 'px'; }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
