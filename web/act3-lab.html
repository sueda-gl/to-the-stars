<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Act 3 lab — the landing</title>
<link rel="stylesheet" href="css/fonts.css">
<style>
  /* lab chrome in the game's paper tokens and type (ART_DIRECTION 17): Basteleur slanted for display, Sentient for text */
  :root { --paper: #f3ecdc; --ink: #3d5588; --red: #e0503f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060d; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .stage { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; pointer-events: none; }
  .stage.on { pointer-events: auto; }
  #plisse { z-index: 30; background: #121834; }
  #lounge { z-index: 34; background: #2e3a60; }
  .lab { position: fixed; top: 14px; left: 14px; z-index: 60; width: 272px; padding: 12px 12px 10px; border-radius: 14px;
    background: rgba(243, 236, 220, 0.92); box-shadow: 0 0 0 1px rgba(61, 85, 136, 0.35); backdrop-filter: blur(6px);
    font-family: var(--ag-font-text); color: var(--ink); }
  .lab h1 { margin: 0 0 2px; font: italic 400 24px var(--ag-font-display); }
  .lab .st { font-size: 13px; margin-bottom: 8px; opacity: .85; min-height: 2.4em; }
  .lab .row { display: flex; flex-wrap: wrap; gap: 5px; margin: 5px 0; }
  .lab .lbl { width: 100%; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .6; margin-top: 4px; }
  .lab button { font: inherit; font-size: 13px; color: var(--ink); background: var(--paper); border: 0; border-radius: 999px;
    padding: 4px 10px; box-shadow: 0 0 0 1px var(--ink); cursor: pointer; }
  .lab button:hover { background: #fff8ea; }
  .lab button:disabled { opacity: .4; cursor: default; }
  .lab button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .lab button.go { background: var(--red); color: var(--paper); box-shadow: 0 0 0 1px var(--red); font-size: 15px; padding: 6px 14px; }
  .lab input[type=range] { width: 100%; accent-color: var(--ink); }
  .lab .min { position: absolute; top: 10px; right: 12px; padding: 0 8px; font-size: 14px; }
  .lab.folded > :not(h1):not(.min) { display: none; }
  .ptt { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 60; font: italic 14px var(--ag-font-text);
    color: rgba(243, 236, 220, .75); pointer-events: none; transition: color .2s; }
  .ptt.held { color: #e0503f; }
  body.shot .lab, body.shot .ptt { display: none; }
</style>
</head>
<body>
<!-- Act 3 lab: the whole landing. Earth orbit (Sueda's Tower Planet, Grain) with Plissé in the sky -> the flight
     (plisse-lab's) -> cross-fade into Plissé (web/worlds/plisse.html, verbatim, driven by plisse-driver.js) -> her camera
     eases to its closest view on the dusk ring -> cross-fade into the landing bridge (web/js/voyage/landing-bridge.js:
     the dive onto the ring, painted into the meadow) -> cross-fade into the Alpine lounge (web/worlds/lounge.html,
     verbatim, lounge-driver.js). "Back home" runs it all in reverse. docs/act3.md.
     ?golden=1 arrives at golden hour; ?shot=1 hides the lab chrome; window.__lab for tests. -->
<div class="lab" id="lab">
  <h1>The landing</h1><button class="min" id="fold" title="Fold">&ndash;</button>
  <div class="st" id="st">building the Tower Planet…</div>
  <div class="row"><button class="go" id="play">Play the landing</button><button id="home" disabled>Back home</button></div>
  <div class="row"><span class="lbl">Steps, landing</span>
    <button id="s1">1 Fly to Plissé</button><button id="s2" disabled>2 To the dusk ring</button>
    <button id="s3" disabled>3 Dive</button><button id="s4" disabled>4 Into the lounge</button></div>
  <div class="row"><span class="lbl">Steps, home</span>
    <button id="r1" disabled>Rise to Plissé</button><button id="r2" disabled>Leave Plissé</button></div>
  <div class="row"><span class="lbl">Options</span>
    <button id="golden" aria-pressed="false">Arrive at golden hour</button></div>
  <div class="row"><span class="lbl">Bridge still (t, s)</span>
    <input type="range" id="bt" min="0" max="10.6" step="0.05" value="0">
    <button id="bHold">Show still</button><button id="bLive">Hide</button></div>
</div>
<div class="ptt" id="ptt">hold Space</div>

<script src="vendor/three.min.js"></script>
<script type="module">
import { createPlanet } from './js/planet/planet.js';
import { createPlisseStandin } from './js/planet/plisse-standin.js';
import { createPlisseDriver, registerPlisseOffline, ARRIVAL } from './js/voyage/plisse-driver.js';
import { createLoungeDriver } from './js/voyage/lounge-driver.js';
import { createLandingBridge, BRIDGE } from './js/voyage/landing-bridge.js';

const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const st = $('st');
const PLISSE = 'worlds/plisse.html', LOUNGE = 'worlds/lounge.html';
if (Q.get('shot') === '1') document.body.classList.add('shot');
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const wait = ms => new Promise(r => setTimeout(r, ms));
const log = (...a) => console.log('[act3]', ...a);
const say = t => { st.textContent = t; log(t); };
let golden = Q.get('golden') === '1';
$('golden').setAttribute('aria-pressed', String(golden));

const offline = registerPlisseOffline(PLISSE, log);   // the worlds/ worker serves three r147 to both worlds

// timings (ms)
const FLIGHT = 8200, TOWER_FADE = 1700, CUT = 900, LEAVE_FADE = 1300;
// perf (docs/perf.md): the hidden worlds are built at load (calm) and cost nothing until just before they are needed.
// Chrome never throttles a hidden same-origin iframe by itself, so the drivers do it:
//   driver.setSize(TINY)  the frame is a tenth of the viewport: the world renders at that size (its clocks, gestures and
//                         animations exact, one per cent of the pixels); setSize(1) at least GROW s before it is shown
//   driver.throttle(0)    frozen (its rAF is gated): for a world nothing needs at all
//   Plissé   tiny + awake from load; frozen while nothing needs her (Earth, after cut 1, the return flight); full size
//            at PLISSE_GROW of the flight out and GROW s before the bridge uncovers her on the way home. Kept after cut
//            1, not unmounted: the way home starts from her ring pose with no reload.
//   lounge   tiny + awake until settled (her 1.4 s fade-in, + her golden-hour ease), then frozen (her cost is draw calls,
//            not pixels); awake again and full size LOUNGE_WAKE s before cut 2
//   bridge   its loop runs only from the dive to cut 2 (landing-bridge.js starts paused after its warm-up)
const TINY = 0.1, PLISSE_GROW = 0.74, GROW = 2.2, LOUNGE_WAKE = 2.2;

// ---------- the Tower Planet (her look, untouched; plisse-lab's set-up) ----------
const planet = createPlanet({ autoStart: false, fail: m => say(m) });
window.__planet = planet;
const RP = planet.terrain.RP, ORBIT_TARGET = new THREE.Vector3(0, RP * 0.16, 0);
planet.orbitSpin(false);
planet.setOrbit({ az: 0.12 });
const standin = createPlisseStandin(planet, { radius: 86 });
function orbitPose() {
  const o = planet.state().orbit;
  const position = new THREE.Vector3(Math.cos(o.el) * Math.sin(o.az), Math.sin(o.el), Math.cos(o.el) * Math.cos(o.az)).multiplyScalar(o.dist).add(ORBIT_TARGET);
  return { position, look: ORBIT_TARGET.clone(), up: new THREE.Vector3(0, 1, 0), fov: 40 };
}
const SKY_SPOT = () => innerWidth / innerHeight < 1 ? { screen: [0.74, 0.13], dist: 2400 } : { screen: [0.77, 0.25], dist: 2400 };
function compose() {
  const p = orbitPose(), cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.8, 9000);
  cam.position.copy(p.position); cam.up.copy(p.up); cam.lookAt(p.look); cam.updateProjectionMatrix();
  return standin.composeFor(cam, SKY_SPOT());
}
compose();
const FISH = planet.post.post.uniforms.uFish, FISH0 = FISH.value;
const setLens = k => { FISH.value = FISH0 * (1 - k); };   // plisse-lab's lens match (always on here)

// ---------- the stages ----------
let state = 'earth', busy = false;
let plisseEl = null, pd = null, loungeEl = null, ld = null, loungeReadyAt = 0, goldenAt = 0, loungeHeld = false, plisseHeld = false;
const bridge = createLandingBridge({ container: document.body, zIndex: 32, golden, log });
bridge.ready().then(() => log('bridge built')).catch(e => say(e.message));
// the worlds build now, in the calm before Play (each build blocks the shared main thread ~0.5-1 s)
// plisseHeld / loungeHeld: 0 = frozen, false = awake
const setPlisse = v => { if (!pd || !pd.isReady() || plisseHeld === v) return; plisseHeld = v; pd.throttle(v === false ? null : v); log('[plisse]', v === false ? 'awake' : 'frozen'); };
const setLounge = v => { if (!ld || !ld.isReady() || loungeHeld === v) return; loungeHeld = v; ld.throttle(v === false ? null : v); log('[lounge]', v === false ? 'awake' : 'frozen'); };
const freezePlisse = () => setPlisse(0), wakePlisse = () => setPlisse(false), freezeLounge = () => setLounge(0), wakeLounge = () => setLounge(false);
const sizePlisse = k => { if (pd && pd.sized !== k) { pd.setSize(k); log('[plisse] size', k); } };
const sizeLounge = k => { if (ld && ld.sized !== k) { ld.setSize(k); log('[lounge] size', k); } };

function mountPlisse() {
  if (plisseEl) return;
  plisseEl = document.createElement('iframe');
  plisseEl.id = 'plisse'; plisseEl.className = 'stage'; plisseEl.title = 'Plissé — the lantern planet'; plisseEl.setAttribute('aria-hidden', 'true');
  document.body.appendChild(plisseEl);
  pd = createPlisseDriver(plisseEl, { log: (...a) => log('[plisse]', ...a) });
  pd.setSize(TINY);
  window.__lab.plisse = pd;
  offline.then(() => { plisseEl.src = PLISSE; });
  plisseHeld = false;
  pd.ready().then(() => {
    pd.hideOwnChrome(true);
    // the stand-in's moons follow her scene clock, its folk her walk clock (a sum of her per-frame dt, which stops
    // while she is frozen), so the two meet at the cross-fade whatever she did meanwhile
    standin.syncClock(() => pd && pd.sceneTime(), { ms: 2000, walk: () => pd && pd.walkTime() });
    // (the loop freezes her while she waits: earth, the return flight, the first half of the flight out)
  }).catch(e => say(e.message));
}
function unmountPlisse() {
  if (!plisseEl) return;
  plisseEl.remove(); plisseEl = null; pd = null; plisseHeld = false; window.__lab.plisse = null; standin.syncClock(null);
}
function mountLounge() {
  if (loungeEl) return;
  loungeEl = document.createElement('iframe');
  loungeEl.id = 'lounge'; loungeEl.className = 'stage'; loungeEl.title = 'The shadelings — Alpine lounge'; loungeEl.setAttribute('aria-hidden', 'true');
  document.body.appendChild(loungeEl);
  ld = createLoungeDriver(loungeEl, { log: (...a) => log('[lounge]', ...a) });
  ld.setSize(TINY);
  window.__lab.lounge = ld;
  loungeReadyAt = 0; goldenAt = 0; loungeHeld = false;
  offline.then(() => { loungeEl.src = LOUNGE; });
  ld.ready().then(async () => {
    loungeReadyAt = performance.now();
    await ld.hideOwnChrome(true);
    if (golden) { await ld.setGoldenHour(true); goldenAt = performance.now(); }
  }).catch(e => say(e.message));
}
// her Golden hour needs frames to ease (~4 s): wake her for it, the loop freezes her again once settled
function loungeGolden(on) {
  if (!ld || !ld.isReady() || ld.state().goldenHour === !!on) return;
  wakeLounge(); ld.setGoldenHour(!!on); goldenAt = on ? performance.now() : 0;
}
function unmountLounge() {
  if (!loungeEl) return;
  loungeEl.remove(); loungeEl = null; ld = null; loungeHeld = false; window.__lab.lounge = null;
}
// the lounge is "settled" once her own 1.4 s canvas fade is over (and, at golden hour, her ~3 s ease to dusk)
const loungeSettled = () => loungeReadyAt > 0 && performance.now() - loungeReadyAt > 1450 && (!golden || (goldenAt > 0 && performance.now() - goldenAt > 4200));

// a cross-fade of one stage's opacity (iframes are only ever faded: never scaled or filtered), each frame calling tick(v)
function fade(el, from, to, ms, tick = null) {
  return new Promise(res => {
    let t0 = performance.now(), held = 0;
    const f = now => {
      // test hook: window.__lab.fadeHold = 0.5 parks every cut at its midpoint until cleared
      const H = window.__lab && window.__lab.fadeHold;
      if (H != null && smooth(0, 1, (now - t0) / ms) >= H) { if (!held) held = now; if (el) el.style.opacity = String(from + (to - from) * H); if (tick) tick(H); requestAnimationFrame(f); return; }
      if (held) { t0 += now - held; held = 0; }
      const v = from + (to - from) * smooth(0, 1, (now - t0) / ms);
      if (el) el.style.opacity = String(v);
      if (tick) tick(v);
      if (now - t0 < ms) requestAnimationFrame(f); else res();
    };
    requestAnimationFrame(f);
  });
}
const herClock = () => ({ sceneTime: pd.sceneTime(), walkTime: pd.walkTime() });
const followPlisse = () => { if (pd && pd.isReady()) bridge.syncClock(herClock()); };
// the bridge reads her clocks (and, while mirroring, her live camera) in its own frame callback, after her gesture step
let mirroring = false;
const herFollow = () => {
  if (!pd || !pd.isReady()) return null;
  if (!mirroring) return { clock: herClock() };
  const c = pd.cameraNow();
  return { clock: herClock(), pose: { theta: c.theta, phi: c.phi, radius: c.radius } };
};

// ---------- 1. Earth orbit -> Plissé (plisse-lab's flight + cross-fade) ----------
let path = null, t0 = 0, fadeT0 = -1, lockPose = null, arrived = null, towerFadeDone = true, early = false;
const matched = () => standin.arrivalPose(pd && pd.isReady() ? pd.cameraNow() : null, { fish: FISH.value });
function flyToPlisse() {
  if (state !== 'earth') return Promise.resolve();
  mountPlisse(); mountLounge();
  path = standin.flight({ from: orbitPose(), to: matched });
  state = 'flying'; t0 = performance.now(); fadeT0 = -1; towerFadeDone = false;
  say('flying to Plissé…');
  return new Promise(res => { arrived = res; });
}
// ---------- 2. Plissé: her camera eases to its closest view, facing the dusk ring ----------
// handOn: resolve as the pinch enters its last CUT ms, so cut 1 runs while her camera is still landing (the bridge
// copies her live pose during it); otherwise resolve once her camera is at rest.
let approachP = null;
const APPROACH = { turnMs: 1000, pinchMs: 2100, rest: 0 };
async function toRing({ handOn = false } = {}) {
  if (state !== 'plisse' && state !== 'arriving') return;
  state = 'approach'; say('Plissé · closing in on the dusk ring…');
  plisseEl.classList.remove('on');
  approachP = pd.approach(BRIDGE.ring, APPROACH).then(c => { approachP = null; return c; });
  if (handOn) await wait(APPROACH.turnMs + APPROACH.pinchMs - CUT);
  else await approachP;
  state = 'ring'; say('Plissé · the dusk ring, her closest view');
}
// ---------- 3. the dive: Plissé -> bridge (matched pose, <= 1 s), the lounge preloads hidden ----------
async function dive() {
  if (state !== 'ring') return;
  state = 'diving'; say('the dive onto the dusk ring…');
  await bridge.ready();
  mountLounge(); loungeGolden(golden);
  bridge.setGolden(golden); bridge.pause(false);
  // cut 1 (<= 1 s): while her pinch is still landing, the bridge copies her live pose and clocks every frame; the
  // dive takes over from her final pose the moment she comes to rest
  mirroring = !!approachP;
  { const c = pd.cameraNow(); followPlisse(); bridge.start({ theta: c.theta, phi: c.phi, radius: c.radius }); }
  bridge.hold(0); bridge.follow(herFollow);
  const fadeP = fade(bridge.el, 0, 1, CUT);
  if (approachP) await approachP;
  mirroring = false;
  { const c = pd.cameraNow(); bridge.start({ theta: c.theta, phi: c.phi, radius: c.radius }); }
  diveDone = bridge.play(1).then(() => { if (state === 'landing') state = 'meadow'; });
  bridge.hold(null);
  await fadeP;
  bridge.follow(null);
  freezePlisse(); plisseEl.style.opacity = '0'; sizePlisse(TINY);   // kept at her ring pose (the way home starts from it); frozen and unseen: no cost
  // hand on while the bridge's camera is still settling onto the lounge's framing (no hold before the last cut);
  // the lounge wakes LOUNGE_WAKE s before the cut
  await new Promise(res => {
    const f = () => {
      const t = bridge.state().t;
      if (t >= BRIDGE.T - LOUNGE_WAKE) { sizeLounge(1); wakeLounge(); }
      if (t >= BRIDGE.T - 0.45 && (stepMode || loungeSettled())) res(); else requestAnimationFrame(f);
    };
    f();
  });
  if (state === 'diving') { state = 'landing'; say('landing in the meadow…'); }
}
let diveDone = Promise.resolve(), stepMode = false;
// ---------- 4. bridge -> the lounge (matched end frame) ----------
async function intoLounge() {
  if (state !== 'landing' && state !== 'meadow') return;
  state = 'landing'; sizeLounge(1); wakeLounge();
  if (!loungeSettled()) { say('the shadelings are lighting their lanterns…'); while (!loungeSettled()) await wait(50); }
  await fade(loungeEl, 0, 1, CUT);
  loungeEl.classList.add('on');
  bridge.pause(true);
  state = 'lounge'; say('on Plissé · the Alpine lounge (the original, driven from outside)');
}
async function playLanding() {
  if (busy || state !== 'earth') return;
  busy = true; buttons();
  early = true;   // hand on to her approach while the Tower -> Plissé fade is finishing (the Tower view tracks her pose)
  try {
    await flyToPlisse();
    await toRing();   // cut 1 starts the moment her pinch comes to rest (it eases out; the dive eases in)
    await dive();
    await intoLounge();
  } finally { busy = false; early = false; buttons(); }
}

// ---------- back home: lounge -> bridge (rising) -> Plissé -> the flight back ----------
async function riseToPlisse() {
  if (state !== 'lounge') return;
  state = 'rising'; say('rising from the meadow…');
  mountPlisse(); wakePlisse();   // she waited frozen at her ring pose under the bridge (or loads now, after a Back home); tiny until GROW s before the cut
  const ls = ld.state();
  if (ls.camera && (Math.abs(ls.camera.theta - ld.camera.home.theta) > 1e-3 || Math.abs(ls.camera.phi - ld.camera.home.phi) > 1e-3 || Math.abs(ls.camera.radius - ld.camera.home.radius) > 1e-3)) {
    say('rising · back to the set first…'); await ld.lookHome({ ms: 900, settle: 900 });
  }
  bridge.setGolden(!!ls.goldenHour); bridge.hold(null); bridge.pause(false);
  bridge.start(BRIDGE.ring);
  // her page loads behind the bridge; once ready, the bridge takes her clocks (it waits for them before uncovering
  // Plissé) and her camera eases to the same dusk-ring view the bridge rises to
  let approached = null;
  pd.ready().then(() => {
    followPlisse(); bridge.start(BRIDGE.ring); bridge.follow(herFollow);
    approached = pd.approach(BRIDGE.ring, { turnMs: 900, pinchMs: 1800, rest: 0 });
  });
  const done = bridge.play(-1);
  // her frame grows GROW s before the bridge uncovers her (the first full-size frame is the heavy one, hidden)
  (function grow() { if (state !== 'rising') return; if (bridge.state().t <= GROW) sizePlisse(1); else requestAnimationFrame(grow); })();
  loungeEl.classList.remove('on');
  await fade(loungeEl, 1, 0, CUT);
  unmountLounge();
  await done;
  while (!approached) await wait(30);
  await approached;
  await pd.ready({ settled: true });
  wakePlisse(); sizePlisse(1);
  await wait(50);   // two frames at full size before she is uncovered
  plisseEl.style.opacity = '1';
  await fade(bridge.el, 1, 0, CUT);
  bridge.follow(null); bridge.pause(true);
  plisseEl.classList.add('on');
  state = 'plisse'; say('on Plissé · the dusk ring');
}
async function leavePlisse() {
  if (state !== 'plisse' && state !== 'ring') return;
  state = 'lifting'; say('lifting off Plissé…');
  plisseEl.classList.remove('on');
  // back out to her opening framing (a pinch, then her opening angle), then plisse-lab's return
  await pd.pinch(ARRIVAL.radius, { ms: 1800 });
  await pd.turn({ theta: ARRIVAL.theta, phi: ARRIVAL.phi }, { ms: 700 });
  lockPose = null; state = 'leaving'; fadeT0 = performance.now();
  say('leaving Plissé…');
  return new Promise(res => { arrived = res; });
}
async function backHome() {
  if (busy || (state !== 'lounge' && state !== 'plisse' && state !== 'ring')) return;
  busy = true; buttons();
  try {
    if (state === 'lounge') await riseToPlisse();
    await leavePlisse();
  } finally { busy = false; buttons(); }
}

// ---------- the Tower loop (renders only while the Earth's space is on screen) ----------
const gaps = {}; let lastNow = 0;   // test probe: the longest frame gap per state
function loop(now) {
  requestAnimationFrame(loop);
  if (lastNow) gaps[state] = Math.max(gaps[state] || 0, now - lastNow); lastNow = now;
  const arriving = state === 'flying' || state === 'arriving' || (state === 'approach' && !towerFadeDone);
  const tower = state === 'earth' || arriving || state === 'leaving' || state === 'returning';
  if (state === 'flying') {   // Plissé: awake and tiny (her clocks exact), full size GROW s before the fade
    const s = Math.min(1, (now - t0) / FLIGHT);
    wakePlisse(); if (s >= PLISSE_GROW) sizePlisse(1);
  } else if (state === 'earth' || state === 'returning') { freezePlisse(); sizePlisse(TINY); }
  if (arriving) {
    const s = Math.min(1, (now - t0) / FLIGHT);
    setLens(smooth(0.55, 0.92, s));
    const pose = path.at(s);
    planet.cameraFree({ position: pose.position, look: pose.look, up: pose.up, fov: 40, snap: true });
    const settled = pd && pd.isSettled();
    if (fadeT0 < 0 && s >= 1 && settled) { fadeT0 = now; state = 'arriving'; say('arriving: the cross-fade'); }
    if (fadeT0 >= 0 && early && arrived && (now - fadeT0) / TOWER_FADE >= 0.55) { const r = arrived; arrived = null; r(); }
    if (fadeT0 < 0 && s >= 1 && !settled) say('holding: Plissé is lighting its lanterns…');
    if (fadeT0 >= 0) {
      const v = smooth(0, 1, (now - fadeT0) / TOWER_FADE);
      plisseEl.style.opacity = String(v);
      if (v >= 1) {
        towerFadeDone = true;
        if (state === 'arriving') { state = 'plisse'; plisseEl.classList.add('on'); say('on Plissé'); }
        if (arrived) { const r = arrived; arrived = null; r(); }
      }
    }
  } else if (state === 'leaving') {
    const pose = matched();
    lockPose = pose;
    planet.cameraFree({ position: pose.position, look: pose.look, up: pose.up, fov: 40, snap: true });
    const v = 1 - smooth(0, 1, (now - fadeT0) / LEAVE_FADE);
    plisseEl.style.opacity = String(v);
    if (v <= 0) {
      path = standin.flight({ from: orbitPose(), to: lockPose });
      state = 'returning'; t0 = now; unmountPlisse();
      mountPlisse();   // for the next Play: she reloads now (a calm beat) and rests frozen
      say('home to the Tower Planet…');
    }
  } else if (state === 'returning') {
    const s = 1 - Math.min(1, (now - t0) / (FLIGHT * 0.85));
    setLens(smooth(0.55, 0.92, s));
    const pose = path.at(s);
    planet.cameraFree({ position: pose.position, look: pose.look, up: pose.up, fov: 40, snap: true });
    if (s <= 0) {
      planet.orbit(); setLens(0); state = 'earth'; say('Earth orbit · Plissé in the sky, upper right');
      if (arrived) { const r = arrived; arrived = null; r(); }
    }
  }
  if (tower) planet.frame(now);
  // the lounge rests once settled, unless it is (about to be) on screen
  if (ld && loungeHeld === false && loungeSettled() && !(state === 'landing' || state === 'meadow' || state === 'lounge' || state === 'rising' || (state === 'diving' && bridge.isReady() && bridge.state().t >= BRIDGE.T - LOUNGE_WAKE))) { freezeLounge(); sizeLounge(TINY); }
  buttons();
}
planet.ready.then(() => say('Earth orbit · Plissé in the sky, upper right'));
requestAnimationFrame(t => { planet.frame(t); requestAnimationFrame(loop); });

// ---------- controls ----------
let lastSig = '';
function buttons() {
  const sig = state + busy;
  if (sig === lastSig) return; lastSig = sig;
  const free = !busy;
  $('play').disabled = !(free && state === 'earth');
  $('home').disabled = !(free && (state === 'lounge' || state === 'plisse' || state === 'ring'));
  $('s1').disabled = !(free && state === 'earth');
  $('s2').disabled = !(free && state === 'plisse');
  $('s3').disabled = !(free && state === 'ring');
  $('s4').disabled = !(free && state === 'meadow');
  $('r1').disabled = !(free && state === 'lounge');
  $('r2').disabled = !(free && (state === 'plisse' || state === 'ring'));
  $('golden').disabled = !(state === 'earth' || state === 'flying' || state === 'arriving' || state === 'plisse' || state === 'ring');
}
const step = fn => async () => { if (busy) return; busy = true; buttons(); try { await fn(); } finally { busy = false; buttons(); } };
$('play').onclick = playLanding;
$('home').onclick = backHome;
$('s1').onclick = step(flyToPlisse);
$('s2').onclick = step(toRing);
$('s3').onclick = step(async () => {
  // step mode: the dive stops on the bridge's last frame (the lounge's opening framing) until "4 Into the lounge"
  if (state !== 'ring') return;
  stepMode = true;
  try { await dive(); await diveDone; } finally { stepMode = false; }
});
$('s4').onclick = step(intoLounge);
$('r1').onclick = step(riseToPlisse);
$('r2').onclick = step(leavePlisse);
$('golden').onclick = () => { golden = !golden; $('golden').setAttribute('aria-pressed', String(golden)); loungeGolden(golden); };
$('bHold').onclick = async () => { await bridge.ready(); bridge.pause(false); bridge.hold(+$('bt').value); bridge.setOpacity(1); };
$('bt').oninput = () => { if (bridge.isReady() && bridge.state().held) bridge.hold(+$('bt').value); };
$('bLive').onclick = () => { if (!bridge.isReady()) return; bridge.hold(null); if (state !== 'diving' && state !== 'landing' && state !== 'meadow' && state !== 'rising') { bridge.setOpacity(0); bridge.pause(true); } };
$('fold').onclick = () => $('lab').classList.toggle('folded');
// push-to-talk stays on the parent: the mark turns red while Space is held, whichever world is on screen
addEventListener('keydown', e => { if (e.code === 'Space') { $('ptt').classList.add('held'); e.preventDefault(); } });
addEventListener('keyup', e => { if (e.code === 'Space') $('ptt').classList.remove('held'); });

window.__lab = {
  planet, standin, bridge, plisse: null, lounge: null, BRIDGE,
  playLanding, backHome, flyToPlisse, toRing, dive, intoLounge, riseToPlisse, leavePlisse,
  get state() { return state; }, get busy() { return busy; }, gaps, fadeHold: null,
  get held() { return { plisse: plisseHeld, lounge: loungeHeld, plisseSize: pd ? pd.sized : null, loungeSize: ld ? ld.sized : null, bridge: bridge.isReady() ? bridge.state().paused : null }; }, TINY,
  setGolden(on) { golden = !!on; $('golden').setAttribute('aria-pressed', String(golden)); loungeGolden(golden); }
};
// perf: both worlds build now, in the calm before Play, and rest frozen until the flight needs them
mountPlisse(); mountLounge();
</script>
