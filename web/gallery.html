<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build gallery</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/paint.css">
<style>
  .plate { position: fixed; left: max(18px, 3.4vmin); bottom: calc(max(18px, 3.4vmin) + env(safe-area-inset-bottom, 0px)); font-family: "Instrument Serif", Georgia, serif; color: var(--ink); pointer-events: none; }
  .plate h1 { margin: 0; font-weight: 400; font-size: 30px; line-height: 1; }
  .plate p { margin: 6px 0 0; font-size: 16px; font-style: italic; opacity: .78; }
  .tags { position: fixed; inset: 0; pointer-events: none; font-family: "Instrument Serif", Georgia, serif; }
  .tag { position: absolute; transform: translate(-50%, 0); color: var(--ink); font-size: 16px; font-style: italic; white-space: nowrap;
    padding: 2px 10px 3px; border-radius: 999px; background: color-mix(in srgb, var(--paper) 82%, transparent); box-shadow: 0 0 0 1px rgba(61, 85, 136, .18); }
  .tag.err { color: var(--red); }
  .tags.mini .tag { font-size: 11px; padding: 1px 6px 2px; }
  .tags.mini .tag.head { font-size: 18px; }
  .tag.head { font-size: 22px; font-style: italic; color: var(--red); background: none; box-shadow: none; letter-spacing: .02em; transform: translate(0, -100%); }
  .tags[hidden] { display: none; }
</style>
</head>
<body>
<!-- Build gallery: every prefab in the library, painted by the real Red arch engine on cream paper.
     ?only=<id>        frame one prefab (or a generated asset id after ?code=)
     ?reveal=<id>      loop the pencil -> paint creation moment on one prefab (&mode=parts for the per-part pop)
     ?massing=demo     a sketch from the sample massing JSON (&paint=1 to paint it)
     ?cat=farm         the pattern book for one category (building farm animal nature landmark prop); none: all, grouped
     ?file=prefabs/a.js,prefabs/b.js   load prefab files not in the catalogue (with ?only=<id>, or alone for a grid of them)
     ?code=<url>       compile a generated build(api) file and show it (&reveal=1 to loop its reveal)
     ?site=<id>        a construction site (scaffold, crates, stakes) running 0 -> 1, then finish()
     ?fill=<kind>      a filler on a hand-drawn demo mark (field forest orchard garden plaza vineyard road wall fence hedge
                       river canal; &reveal=1 loops pencil -> paint); ?fill=all lays every filler out
     ?only=<id>&fit=8,6  lib.create(..., { fit: { w: 8, d: 6 } }) inside a drawn 8 x 6 outline
     ?view=bird        the game's leader camera (~60 deg down; judge roofs, courtyards, cast shadows); view=top: plan view
     ?freeze=sketch:0.6 | paint:0.5 | site:0.4   hold a phase (screenshots)   ?view=bird|eye  ?yaw= ?pitch= ?dist=  ?nofolk  ?notags  #riso #raw -->
<div class="plate"><h1>The Ministry of Builds</h1><p id="sub">pattern book</p></div>
<div class="tags" id="tags"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/Reflector.js"></script>
<script type="module">
import { createRenderer, createContext } from './js/paint/context.js';
import { createBackdrop } from './js/paint/backdrop.js';
import { createKit } from './js/paint/kit.js';
import { createFolk } from './js/paint/folk.js';
import { createPainter } from './js/paint/post.js';
import { mountPaintUI } from './js/paint/ui.js';
import { createBuildApi } from './js/buildings/api.js';
import { createLibrary } from './js/buildings/library.js';
import { createReveal } from './js/buildings/reveal.js';
import { createSite } from './js/buildings/construction.js';
import { renderSketchFromMassing, SAMPLE_MASSING } from './js/buildings/sketch.js';
import { createFillers, FILL_KINDS } from './js/buildings/fill.js';

const q = new URLSearchParams(location.search);
const renderer = createRenderer();
const scene = new THREE.Scene();
const camBase = new THREE.Vector3(0, 7, 24);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 1400);
const ctx = createContext({ renderer, scene, camera, seed: 7 });
const { V, R } = ctx;
const kit = createKit(ctx);
const backdrop = createBackdrop(ctx, { camBase });
const api = createBuildApi(ctx, kit, { keyDir: backdrop.KEY_DIR });
const lib = createLibrary(ctx, kit, { api });
const fillers = createFillers(ctx, kit, api, { lib });

// the cream paper ground, catching the key light's shadows (as paint-sandbox.html)
// (its far edge stops at z = -60 so the reference sea still shows beyond it, like a coast)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 260), new THREE.MeshLambertMaterial({ color: 0xe9dcc8 }));
ground.rotation.x = -Math.PI / 2; ground.position.z = 70; ground.receiveShadow = true; scene.add(ground);

// colour bloom stand-in (the world module owns the real one): a soft painted disc that grows under a reveal
const bloomMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uP: { value: 0 }, uCol: { value: new THREE.Color('#d9b98c') } },
  vertexShader: 'varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: `uniform float uP; uniform vec3 uCol; varying vec2 vP;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
    void main(){ float r = length(vP) + 0.22*(n(vP*1.3)-0.5) + 0.1*(n(vP*4.0)-0.5);
      float a = smoothstep(uP, uP*0.7, r) * 0.55; if (a < 0.01) discard; gl_FragColor = vec4(uCol, a); }`
});
const bloom = new THREE.Mesh(new THREE.CircleGeometry(1, 48), bloomMat);
bloom.rotation.x = -Math.PI / 2; bloom.position.y = 0.01; ctx.colourOnly.push(bloom);
const bloomHolder = new THREE.Group(); bloomHolder.visible = false; bloomHolder.add(bloom); scene.add(bloomHolder);   // the painter forces colourOnly members visible: hide the parent

// a few folk for scale; they wander a box around the exhibits and keep off the plinths
const HALF = 26, obstacles = [];
const nav = {
  obstacles, spots: [[-3, 8], [3, 9], [0, 7], [-6, 8], [6, 7]], closeFocus: V(0, 1.1, 6),
  pickTarget(a) { a.path = [V(R(-HALF, HALF), 0, R(-6, 12))]; },
  bounds(p) { p.x = Math.max(-HALF, Math.min(HALF, p.x)); p.z = Math.max(-HALF, Math.min(16, p.z)); },
  extraPush() {}, flyTarget(f) { f.route = [V(R(-12, 12), R(4, 8), R(-6, 8))]; }, floatTarget(f) { f.route.push(V(R(-12, 12), R(5, 8), R(-6, 8))); },
  flyPush() {}, onArrive() {}
};
const folk = createFolk(ctx, backdrop, nav);
const crowd = q.has('nofolk') ? [] : [folk.make.puffer(0), folk.make.pip(1), folk.make.drop(2), folk.make.loaf(3)];
folk.update(0.016, 0);

const painter = createPainter(ctx, folk, { framing: (cam, w, h) => { cam.aspect = w / h; cam.fov = w / h < 1 ? 52 : 36; } });
addEventListener('resize', () => painter.resize());
mountPaintUI(painter, { closeUp: false });
if (!/riso|raw|gouache/.test(location.hash)) painter.setMode(1);   // the gallery opens in Gouache
painter.resize();

// ---------- what to show ----------
const tagsEl = document.getElementById('tags'); if (q.has('notags')) tagsEl.hidden = true;
const sub = document.getElementById('sub');
const shown = [];   // { obj, label, err }
function exhibit(obj, label, x, z, err) {
  obj.position.set(x, 0, z); scene.add(obj);
  const s = obj.userData.agora && obj.userData.agora.size || { w: 4, d: 4 };
  obstacles.push([x, z, Math.max(s.w, s.d) * 0.6 + 0.4]);
  const el = document.createElement('div'); el.className = 'tag' + (err ? ' err' : ''); el.textContent = label; tagsEl.append(el);
  shown.push({ obj, el }); return obj;
}
// a category heading, hand-lettered on the paper in front of its group (bird view: it sits on the ground like a place name)
function heading(label, x, z) {
  const el = document.createElement('div'); el.className = 'tag head'; el.textContent = label; tagsEl.append(el);
  shown.push({ obj: { userData: {} }, el, at: { x, z } });
}
const look = V(0, 2, 0);
let rig = { yaw: -0.32, pitch: 0.2, dist: 22, target: look.clone() };
let frameBox = new THREE.Box3();
// pull the camera back until every corner of the framed box is on screen (inside a margin): no cropped exhibits
function fitFrame(margin = 0.86, tighten = false) {
  if (frameBox.isEmpty()) return;
  const p = new THREE.Vector3();
  const worstOf = () => {
    placeCam(); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    let worst = 0;
    for (let i = 0; i < 8; i++) {
      p.set(i & 1 ? frameBox.max.x : frameBox.min.x, i & 2 ? frameBox.max.y : frameBox.min.y, i & 4 ? frameBox.max.z : frameBox.min.z).project(camera);
      worst = Math.max(worst, Math.abs(p.x), Math.abs(p.y) * (p.y < 0 ? 1.12 : 1));   // room at the bottom for the plate
    }
    return worst;
  };
  for (let k = 0; k < 40 && worstOf() > margin; k++) rig.dist *= 1.06;
  // the big pattern book: also pull in until the box fills the frame (frameOn's guess is generous for a wide grid)
  if (tighten) for (let k = 0; k < 60; k++) { rig.dist *= 0.96; if (worstOf() > margin) { rig.dist /= 0.96; break; } }
}
function frameOn(objs) {
  const b = new THREE.Box3(); objs.forEach(o => b.expandByObject(o));
  if (objs.length > 12) b.max.y = Math.min(b.max.y, 6);   // the book is read as a plan: one tall campanile must not push the camera out
  frameBox = b.clone();
  const c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
  rig.target.set(c.x, Math.max(1.2, c.y * 0.85), c.z);
  const fov = THREE.MathUtils.degToRad(camera.fov || 36), aspect = innerWidth / innerHeight;
  const needH = s.y * 1.25 + 1.5, needW = Math.max(s.x, s.z) * 1.15 + 2;
  rig.dist = Math.max(needH / (2 * Math.tan(fov / 2)), needW / (2 * Math.tan(fov / 2) * aspect)) + Math.max(s.x, s.z) * 0.5;
}
function placeCam() {
  const { yaw, pitch, dist, target } = rig;
  camera.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(target);
}
// drag to orbit, wheel to zoom
{ let drag = null; const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw: rig.yaw, pitch: rig.pitch }; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => { if (!drag) return; rig.yaw = drag.yaw - (e.clientX - drag.x) * 0.006; rig.pitch = Math.max(0.04, Math.min(1.5, drag.pitch + (e.clientY - drag.y) * 0.004)); painter.markDirty(); });
  el.addEventListener('pointerup', () => { drag = null; });
  el.addEventListener('wheel', e => { rig.dist = Math.max(4, Math.min(160, rig.dist * Math.exp(e.deltaY * 0.001))); painter.markDirty(); }, { passive: true });
}

let reveal = null, site = null, loop = null;
const freeze = (q.get('freeze') || '').split(':');
async function revealLoop(obj) {
  const r = createReveal(ctx, obj, { mode: q.get('mode') || 'wash', onBloom: ({ x, z, radius, p }) => {
    bloomHolder.visible = p > 0; bloom.position.set(x, 0.01, z); bloom.scale.setScalar(Math.max(0.01, radius)); bloomMat.uniforms.uP.value = 1.0; } });
  reveal = r;
  if (freeze[0]) { r.hide(); if (freeze[0] === 'sketch') r.setSketch(+freeze[1] || 0.5); else { r.setSketch(1); r.setPaint(+freeze[1] || 0.5); } return; }
  for (;;) {
    r.hide(); bloomHolder.visible = false; await wait(600);
    await r.sketch(1.1); await wait(700);
    await r.paint(4.0); r.done(); await wait(2600);
  }
}
const wait = ms => new Promise(res => setTimeout(res, ms));

async function main() {
  const only = q.get('only'), rev = q.get('reveal'), code = q.get('code'), massing = q.get('massing'), siteId = q.get('site');
  await lib.load();
  // ?file=prefabs/a.js,prefabs/b.js : import prefab files that are not (yet) in the catalogue and show only them
  let fileIds = null;
  if (q.get('file')) {
    fileIds = [];
    for (const f of q.get('file').split(',').filter(Boolean)) {
      try { const mod = await import('./js/buildings/' + f.replace(/^\/+/, '')); const id = (mod.meta && mod.meta.id) || f.split('/').pop().replace(/\.js$/, ''); lib.define(id, mod); fileIds.push(id); }
      catch (e) { console.error('[gallery] file', f, e); }
    }
  }
  let focus = [];
  if (code) {
    const src = await (await fetch(code)).text();
    const name = code.split('/').pop().replace(/\.js$/, '');
    const res = lib.register({ id: 'gen-' + name, name, code: src });
    const obj = lib.create('gen-' + name);
    exhibit(obj, res.ok ? name : name + ' (failed: ' + res.error + ')', 0, 0, !res.ok);
    sub.textContent = 'generated asset · ' + name;
    focus = [obj]; if (rev) revealLoop(obj);
  } else if (massing) {
    const obj = renderSketchFromMassing(api, SAMPLE_MASSING);
    exhibit(obj, 'massing sketch · ' + SAMPLE_MASSING.name.toLowerCase(), 0, 0);
    sub.textContent = 'a sketch from a massing JSON';
    focus = [obj];
    const r = createReveal(ctx, obj, {}); reveal = r; r.hide();
    if (freeze[0] === 'paint' || q.has('paint')) { r.setSketch(1); if (freeze[0]) r.setPaint(+freeze[1] || 0.5); else r.sketch(0.8).then(() => r.paint(4)).then(() => r.done()); }
    else r.sketch(freeze[0] ? 0 : 1.0).then(() => freeze[0] && r.setSketch(+freeze[1] || 1));
  } else if (siteId) {
    const obj = lib.create(siteId);
    exhibit(obj, siteId + ' · under construction', 0, 0);
    site = createSite({ kind: siteId, footprint: lib.info(siteId) && lib.info(siteId).size }, obj, { ctx, api });
    scene.add(site.object);
    focus = [obj, site.object]; sub.textContent = 'a construction site';
    const p0 = freeze[0] === 'site' ? +freeze[1] : null;
    if (p0 !== null) site.setProgress(p0);
    else (async () => { for (;;) { site.reset(); await wait(1200); for (let p = 0; p <= 1.0001; p += 0.01) { site.setProgress(p); await wait(60); } await site.finish(); await wait(2500); } })();
  } else if (q.get('fill')) {
    const kinds = q.get('fill') === 'all' ? ['field', 'forest', 'orchard', 'garden', 'plaza', 'vineyard', 'road', 'wall', 'fence', 'hedge', 'river', 'canal'] : [q.get('fill')];
    const cols = Math.min(4, kinds.length), gap = 26;
    kinds.forEach((kind, i) => {
      const cx = (i % cols - (cols - 1) / 2) * gap, cz = -Math.floor(i / cols) * gap * 0.8;
      const mark = demoMark(FILL_KINDS[kind], cx, cz, 7 + i);
      const obj = fillers.make(kind, mark, q.get('crop') ? { crop: q.get('crop') } : {});
      if (!obj) return;
      scene.add(obj); focus.push(obj);
      const el = document.createElement('div'); el.className = 'tag'; el.textContent = kind; tagsEl.append(el);
      shown.push({ obj, el, at: { x: obj.position.x, z: markMaxZ(mark) + 1.2 } });
      if (rev) revealLoop(obj);
    });
    sub.textContent = kinds.length > 1 ? 'areas and strokes · ' + kinds.length + ' fillers' : 'filler · ' + kinds[0];
  } else if (only || rev) {
    const id = only || rev;
    const fit = q.get('fit') ? q.get('fit').split(',').map(Number) : null;
    const obj = lib.create(id, { rot: +(q.get('rot') || 0), variant: +(q.get('variant') || 0), fit: fit ? { w: fit[0], d: fit[1] } : null });
    exhibit(obj, id + (fit ? ` · fit ${fit[0]} × ${fit[1]} (×${obj.userData.agora.fit.toFixed(2)})` : ''), 0, 0, obj.userData.agora.fallback);
    if (fit) { const out = fillers.make('hedge', [[-fit[0] / 2, -fit[1] / 2], [fit[0] / 2, -fit[1] / 2], [fit[0] / 2, fit[1] / 2], [-fit[0] / 2, fit[1] / 2], [-fit[0] / 2, -fit[1] / 2]], { h: 0.25, width: 0.2 }); scene.add(out); }
    sub.textContent = rev ? 'pencil, then paint' : 'prefab · ' + id;
    focus = [obj]; if (rev) revealLoop(obj);
  } else {
    // the pattern book: every prefab grouped by category (the manifest's order: building, farm, animal, nature, landmark,
    // prop), each group a block of rows with a heading in front; ?cat=farm shows one group. Rows are packed by each
    // prefab's own width, so big ones (the assembly) don't crowd their neighbours.
    const cat = q.get('cat');
    const groups = fileIds ? [{ category: 'files', ids: fileIds }] : lib.byCategory(lib.ids()).filter(g => !cat || g.category === cat);
    const total = groups.reduce((a, g) => a + g.ids.length, 0);
    // build everything first, then pack rows greedily up to a row width that keeps the whole book roughly square
    const made = groups.map(g => ({ ...g, items: g.ids.map(id => { const obj = lib.create(id, { variant: 0 }); const s = obj.userData.agora.size || { w: 4, d: 4 }; return { id, obj, w: Math.max(9, s.w + 5), d: s.d }; }) }));
    const sumW = made.reduce((a, g) => a + g.items.reduce((b, e) => b + e.w, 0), 0);
    const rowMax = total <= 8 ? Infinity : Math.max(60, Math.sqrt(sumW * 20) * 1.15);
    let z = 0;
    for (const grp of made) {
      // as many rows as the width needs, evenly filled (no orphan at the back)
      const gw = grp.items.reduce((a, e) => a + e.w, 0), nRows = Math.max(1, Math.ceil(gw / rowMax)), per = Math.ceil(grp.items.length / nRows);
      const rows = []; for (let i = 0; i < grp.items.length; i += per) rows.push(grp.items.slice(i, i + per));
      rows.forEach((row, r) => {
        const tw = row.reduce((a, e) => a + e.w, 0), dmax = Math.max(...row.map(e => e.d));
        let x = -tw / 2; if (r === 0) heading(`${grp.category} · ${grp.items.length}`, x - 5, z + 1);   // left of the front row
        row.forEach(e => { focus.push(exhibit(e.obj, e.id, x + e.w / 2, z - dmax / 2, e.obj.userData.agora.fallback)); x += e.w; });
        z -= dmax + 8;
      });
      z -= 7;   // a lane between the groups
    }
    if (total > 40) { tagsEl.classList.add('mini'); ground.geometry.dispose(); ground.geometry = new THREE.PlaneGeometry(1400, 1400); ground.position.z = z / 2; }   // the big book: more paper, smaller labels
    if (total > 12 && !q.get('yaw')) rig.yaw = 0;   // a wide grid is read straight on, not from the corner
    sub.textContent = `pattern book · ${total} prefab${total === 1 ? '' : 's'}${cat ? ' · ' + cat : ' · ' + groups.length + ' categories'}`;
  }
  frameOn(focus);
  // ?view=bird: the game's leader camera, a high oblique bird's-eye (~60 deg down); ?view=top: nearly straight down
  const view = q.get('view') || 'eye';
  if (view === 'bird') { rig.pitch = 1.05; rig.dist *= focus.length > 1 ? 1.15 : 1.25; }
  if (view === 'top') { rig.pitch = 1.42; rig.dist *= 1.2; }
  if (q.get('yaw')) rig.yaw = +q.get('yaw');
  if (q.get('pitch')) rig.pitch = +q.get('pitch');
  fitFrame(0.86, focus.length > 12);
  if (q.get('dist')) rig.dist *= +q.get('dist');
  // folk gather in front of the exhibits
  const fb = new THREE.Box3(); focus.forEach(o => fb.expandByObject(o));
  const spots = focus.length > 1 ? crowd.map((a, i) => [rig.target.x + (i - 1.5) * 2.6, fb.max.z + 1.6 + (i % 2) * 0.9])
    : crowd.map((a, i) => [i < 2 ? fb.min.x - 0.9 - i * 1.3 : fb.max.x + 0.9 + (i - 2) * 1.3, fb.max.z - 0.4 + (i % 2) * 1.1]);
  crowd.forEach((a, i) => { a.pos.set(spots[i][0], a.pos.y, spots[i][1]); a.root.position.copy(a.pos); a.placed = false; a.legsPlaced = false; a.wait = 3 + i * 2; });
  painter.markDirty();
  window.__gallery.ready = true;
}

// a hand-drawn-looking demo mark: a wobbly loop (area) or a gentle S stroke (line) around (cx, cz)
function demoMark(kind, cx, cz, seed) {
  const r = ctx.mulberry32(seed), pts = [];
  if (kind === 'area') {
    for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, k = 1 + 0.16 * Math.sin(a * 2 + seed) + 0.08 * (r() - 0.5); pts.push([cx + Math.cos(a) * 9 * k, cz + Math.sin(a) * 6.2 * k]); }
    return { kind: 'area', poly: pts };
  }
  for (let i = 0; i <= 8; i++) { const t = i / 8; pts.push([cx - 10 + 20 * t, cz + Math.sin(t * Math.PI * 1.6 + seed) * 3.2]); }
  return { kind: 'line', pts };
}
const markMaxZ = mark => Math.max(...(mark.poly || mark.pts).map(p => p[1]));

const tmp = new THREE.Vector3();
function tags() {
  shown.forEach(({ obj, el, at }) => {
    const s = obj.userData.agora && obj.userData.agora.size || { d: 4 };
    if (at) tmp.set(at.x, -0.2, at.z); else tmp.set(obj.position.x, -0.2, obj.position.z + s.d * 0.5 + 0.6);
    tmp.project(camera);
    el.style.left = ((tmp.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - tmp.y) / 2 * innerHeight + 6) + 'px';
    el.style.display = tmp.z < 1 ? '' : 'none';
  });
}

window.__gallery = { ready: false, lib, api, ctx, painter, scene, exhibit, frameOn, fitFrame, fillers, createReveal, renderSketchFromMassing, get reveal() { return reveal; }, get site() { return site; }, shown, rig };
main().catch(e => { console.error(e); sub.textContent = 'error: ' + e.message; window.__gallery.error = e.message; window.__gallery.ready = true; });

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  folk.update(dt, t);
  painter.frame(dt, t, tt => { placeCam(); backdrop.update(tt); lib.update(tt); tags(); });
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
