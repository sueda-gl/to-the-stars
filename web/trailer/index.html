<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALOUD trailer: player</title>
<!--
  Trailer player / preview (docs/trailer.md). Lists the trailer scenes (web/trailer/*.html, each a fixed-clock __shot page),
  scrubs them frame-exactly through window.__shot.seek(t) in an iframe at 1920x1080 scaled to fit, and plays the final cut
  (shots/trailer/aloud-trailer-v1.mp4, reached through the web/trailer/out symlink) with its beat timeline from timeline.json.
  Keys: Space play/pause · , . step a frame · Home · 1-9 jump to a scene.
-->
<style>
  @font-face { font-family: "Title Melodrama"; src: url(../assets/fonts/Melodrama-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: Sentient; src: url(../assets/fonts/Sentient-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: Sentient; src: url(../assets/fonts/Sentient-Italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
  :root { --night: #060814; --ink: #eee5cd; --dim: rgba(238,229,205,.55); --line: rgba(238,229,205,.16); --gold: #d6bd86; --paper: #efe6d0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font: 15px/1.45 Sentient, Georgia, serif; }
  .app { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
  aside { border-right: 1px solid var(--line); padding: 22px 18px; overflow: auto; }
  h1 { margin: 0 0 4px; font: 600 26px/1 "Title Melodrama", Georgia, serif; letter-spacing: .22em; text-transform: uppercase; }
  .tag { color: var(--dim); font-style: italic; margin: 0 0 22px; }
  h2 { margin: 18px 0 8px; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); font-weight: 400; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; gap: 8px; padding: 7px 8px; border-radius: 4px; cursor: pointer; }
  li:hover { background: rgba(238,229,205,.06); } li.on { background: rgba(238,229,205,.1); }
  li .k { color: var(--dim); font-size: 12px; } li.missing { opacity: .4; }
  main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; height: 100%; }
  .stage { position: relative; min-height: 0; background: #000; overflow: hidden; }
  .frame { position: absolute; left: 0; top: 0; }
  .frame { position: relative; width: 1920px; height: 1080px; transform-origin: top left; }
  .frame iframe, .frame video { width: 1920px; height: 1080px; border: 0; background: #000; display: block; }
  .frame video { object-fit: contain; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-style: italic; }
  .bar { padding: 14px 18px 18px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
  .row { display: flex; align-items: center; gap: 14px; }
  button { background: none; border: 1px solid var(--line); color: var(--ink); font: inherit; padding: 5px 12px; border-radius: 3px; cursor: pointer; }
  button:hover { border-color: var(--gold); color: var(--gold); }
  .t { font-variant-numeric: tabular-nums; min-width: 150px; color: var(--dim); }
  .scrub { position: relative; height: 26px; flex: 1; cursor: pointer; }
  .scrub .track { position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: var(--line); }
  .scrub .head { position: absolute; top: 6px; width: 2px; height: 14px; background: var(--ink); margin-left: -1px; }
  .scrub .mark { position: absolute; top: 9px; width: 1px; height: 8px; background: var(--gold); opacity: .7; }
  .scrub .mark span { position: absolute; top: 10px; left: 2px; font-size: 10px; letter-spacing: .08em; color: var(--gold); white-space: nowrap; opacity: .8; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 12px; color: var(--dim); cursor: pointer; }
  .chip:hover { color: var(--gold); border-color: var(--gold); }
  .note { color: var(--dim); font-size: 12px; font-style: italic; }
  a { color: var(--gold); text-decoration: none; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Aloud</h1>
    <p class="tag">launch trailer, preview</p>
    <h2>Final cut</h2>
    <ul id="finals"></ul>
    <h2>Scenes</h2>
    <ul id="scenes"></ul>
    <h2>Cut list</h2>
    <ul id="segments"></ul>
    <p class="note" id="status"></p>
  </aside>
  <main>
    <div class="stage" id="stage"><div class="frame" id="frame"><div class="empty">pick a scene or the final cut</div></div></div>
    <div class="bar">
      <div class="row">
        <button id="play">play</button>
        <button id="step-prev" title=",">&lsaquo; frame</button>
        <button id="step-next" title=".">frame &rsaquo;</button>
        <span class="t" id="time">0.000 s · f0</span>
        <div class="scrub" id="scrub"><div class="track"></div><div id="marks"></div><div class="head" id="head"></div></div>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </main>
</div>
<script>
const FPS = 30, W = 1920, H = 1080;
const $ = s => document.querySelector(s);
const scenesEl = $('#scenes'), segsEl = $('#segments'), finalsEl = $('#finals'), frame = $('#frame'), stage = $('#stage');
const timeEl = $('#time'), head = $('#head'), marksEl = $('#marks'), chips = $('#chips'), status = $('#status');
const SCENES = ['t1-reception', 't2-launch', 't3-cabin', 't4-space', 't5-contact', 't6-unbuild', 'card'];
let cur = null;   // { kind: 'shot'|'video', dur, seek(t), t, marks }
let playing = false, raf = 0, t0 = 0, tStart = 0;

function fit() { const s = Math.min(stage.clientWidth / W, stage.clientHeight / H); frame.style.transform = `translate(${(stage.clientWidth - W * s) / 2}px, ${(stage.clientHeight - H * s) / 2}px) scale(${s})`; }
addEventListener('resize', fit); fit();

async function head_(url) { try { return (await fetch(url, { method: 'HEAD' })).ok; } catch { return false; } }
async function json(url) { try { const r = await fetch(url, { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch { return null; } }

function setTime(t) {
  if (!cur) return; t = Math.max(0, Math.min(cur.dur, t)); cur.t = t; cur.seek(t);
  timeEl.textContent = `${t.toFixed(3)} s · f${Math.round(t * FPS)} / ${cur.dur.toFixed(2)} s`;
  head.style.left = `${(t / cur.dur) * 100}%`;
}
function stop() { playing = false; cancelAnimationFrame(raf); $('#play').textContent = 'play'; if (cur?.kind === 'video') cur.el.pause(); }
function play() {
  if (!cur) return; if (playing) return stop();
  playing = true; $('#play').textContent = 'pause';
  if (cur.kind === 'video') { cur.el.play(); const tick = () => { if (!playing) return; setTimeShown(cur.el.currentTime); raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick); return; }
  t0 = performance.now(); tStart = cur.t >= cur.dur - 1 / FPS ? 0 : cur.t;
  const tick = () => { if (!playing) return; const t = tStart + (performance.now() - t0) / 1000; if (t >= cur.dur) { setTime(cur.dur); return stop(); } setTime(Math.floor(t * FPS) / FPS); raf = requestAnimationFrame(tick); };
  raf = requestAnimationFrame(tick);
}
function setTimeShown(t) { cur.t = t; timeEl.textContent = `${t.toFixed(3)} s · f${Math.round(t * FPS)} / ${cur.dur.toFixed(2)} s`; head.style.left = `${(t / cur.dur) * 100}%`; }
function drawMarks(marks) {
  marksEl.innerHTML = '';
  for (const [k, v] of Object.entries(marks || {})) { const t = Array.isArray(v) ? v[0] : v; if (typeof t !== 'number' || !cur) continue; const m = document.createElement('div'); m.className = 'mark'; m.style.left = `${(t / cur.dur) * 100}%`; m.innerHTML = `<span>${k}</span>`; marksEl.appendChild(m); }
}
$('#scrub').addEventListener('pointerdown', e => { const r = e.currentTarget.getBoundingClientRect(); const go = ev => { if (!cur) return; const u = (ev.clientX - r.left) / r.width; if (cur.kind === 'video') { cur.el.currentTime = u * cur.dur; setTimeShown(u * cur.dur); } else setTime(Math.round(u * cur.dur * FPS) / FPS); }; go(e); const mv = ev => go(ev); addEventListener('pointermove', mv); addEventListener('pointerup', () => removeEventListener('pointermove', mv), { once: true }); });
$('#play').onclick = play;
$('#step-prev').onclick = () => { stop(); if (cur?.kind === 'video') { cur.el.currentTime -= 1 / FPS; setTimeShown(cur.el.currentTime); } else setTime(cur.t - 1 / FPS); };
$('#step-next').onclick = () => { stop(); if (cur?.kind === 'video') { cur.el.currentTime += 1 / FPS; setTimeShown(cur.el.currentTime); } else setTime(cur.t + 1 / FPS); };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); play(); } else if (e.key === ',') $('#step-prev').click(); else if (e.key === '.') $('#step-next').click(); else if (e.key === 'Home') setTime(0); else if (/^[1-9]$/.test(e.key)) scenesEl.children[+e.key - 1]?.click(); });

async function openScene(name, query = '') {
  stop(); frame.innerHTML = ''; chips.innerHTML = ''; marksEl.innerHTML = '';
  const f = document.createElement('iframe'); f.src = `${name}.html${query}`; frame.appendChild(f);
  status.textContent = `loading ${name}…`;
  await new Promise(res => f.onload = res);
  const w = f.contentWindow; const t1 = Date.now();
  while (!w.__shot && Date.now() - t1 < 30000) await new Promise(r => setTimeout(r, 100));
  if (!w.__shot) { status.textContent = `${name}: no window.__shot`; return; }
  if (w.__shot.ready?.then) await w.__shot.ready;
  cur = { kind: 'shot', dur: Number(w.__shot.duration) || 0, seek: t => w.__shot.seek(t), t: 0, marks: w.__shot.marks || Object.fromEntries((w.__shot.shots || []).map(s => [s.id || s.name, s.t0 ?? 0])) };
  drawMarks(cur.marks); setTime(0);
  status.textContent = `${name}: ${cur.dur.toFixed(2)} s = ${Math.round(cur.dur * FPS)} frames`;
  for (const [k, v] of Object.entries(cur.marks)) { const t = Array.isArray(v) ? v[0] : v; if (typeof t !== 'number') continue; const c = document.createElement('span'); c.className = 'chip'; c.textContent = `${k} ${t.toFixed(1)}s`; c.onclick = () => setTime(t); chips.appendChild(c); }
}
async function openVideo(src, timeline) {
  stop(); frame.innerHTML = ''; chips.innerHTML = ''; marksEl.innerHTML = '';
  const v = document.createElement('video'); v.src = src; v.controls = false; v.playsInline = true; frame.appendChild(v);
  await new Promise(res => v.onloadedmetadata = res);
  cur = { kind: 'video', el: v, dur: v.duration, seek: t => { v.currentTime = t; }, t: 0, marks: {} };
  if (timeline) { cur.marks = Object.fromEntries(timeline.map(x => [x.id, x.start])); drawMarks(cur.marks); for (const x of timeline) { const c = document.createElement('span'); c.className = 'chip'; c.textContent = `${x.id} ${x.start.toFixed(1)}–${x.end.toFixed(1)}s`; c.onclick = () => { v.currentTime = x.start; setTimeShown(x.start); }; chips.appendChild(c); } }
  setTimeShown(0); status.textContent = `${src.split('/').pop()}: ${v.duration.toFixed(2)} s`;
  v.onended = stop;
}
function pick(li) { for (const x of document.querySelectorAll('li.on')) x.classList.remove('on'); li.classList.add('on'); }

(async () => {
  for (const name of SCENES) {
    const ok = await head_(`${name}.html`);
    const li = document.createElement('li'); li.innerHTML = `<span>${name}</span><span class="k">${ok ? '' : 'not built'}</span>`; li.classList.toggle('missing', !ok);
    if (ok) li.onclick = () => { pick(li); openScene(name, name === 'card' ? '?text=ALOUD&sub=A%20civilisation%2C%20spoken%20aloud&dur=8&fin=1.2&fout=1.6&size=190' : ''); };
    scenesEl.appendChild(li);
  }
  const cut = await json('out/cut.json'), tl = await json('out/timeline.json');
  for (const s of cut?.segments || []) {
    const li = document.createElement('li'); const ref = s.scene ? `${s.scene}${typeof s.in === 'string' ? ' @' + s.in : s.in ? ' @' + s.in + 's' : ''}` : s.type;
    li.innerHTML = `<span>${s.id}</span><span class="k">${ref}${s.dur ? ' · ' + s.dur + 's' : ''} · ${s.out || 'cut'}</span>`;
    if (s.scene) li.onclick = async () => { pick(li); await openScene(s.scene); const m = cur.marks; let t = typeof s.in === 'number' ? s.in : 0; if (typeof s.in === 'string') { const mm = /^([^+-]+?)\s*([+-]\s*\d*\.?\d+)?$/.exec(s.in); const v = m[mm[1].trim()]; t = (Array.isArray(v) ? v[0] : v ?? 0) + (mm[2] ? Number(mm[2].replace(/\s/g, '')) : 0); } setTime(t); };
    else if (s.type === 'card') li.onclick = () => { pick(li); openScene('card', '?' + new URLSearchParams(Object.fromEntries(Object.entries({ text: s.text, sub: s.sub, face: s.face, italic: s.italic, size: s.size, dur: s.dur, fin: s.fin, fout: s.fout }).filter(([, v]) => v != null))).toString()); };
    segsEl.appendChild(li);
  }
  for (const f of ['aloud-trailer-v1.mp4', 'gameplay/raw.mp4']) {
    const ok = await head_(`out/${f}`); const li = document.createElement('li'); li.innerHTML = `<span>${f}</span><span class="k">${ok ? (f.startsWith('aloud') && tl ? tl.duration.toFixed(1) + ' s' : '') : 'not rendered'}</span>`; li.classList.toggle('missing', !ok);
    if (ok) li.onclick = () => { pick(li); openVideo(`out/${f}`, f.startsWith('aloud') ? tl?.timeline : null); };
    finalsEl.appendChild(li);
  }
  if (tl) { const li = document.createElement('li'); li.innerHTML = `<a href="out/aloud-trailer-v1-contact.png" target="_blank">contact sheet</a><span class="k">${tl.built?.slice(0, 16).replace('T', ' ') || ''}</span>`; finalsEl.appendChild(li); }
  status.textContent = 'Space play · , . frame step · 1-9 scenes';
})();
</script>
</body>
</html>
