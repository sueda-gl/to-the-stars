<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red arch at sundown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3ecdc; --ink: #3d5588; --red: #e0503f;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #f3ecdc; --ink: #3d5588; } }
  :root[data-theme="dark"] { --paper: #f3ecdc; --ink: #3d5588; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--paper); }
  canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; touch-action: none; }
  .editions {
    position: fixed; right: max(18px, 3.4vmin); bottom: calc(max(18px, 3.4vmin) + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 2px; padding: 3px; border-radius: 999px;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    box-shadow: 0 0 0 1px rgba(61, 85, 136, .25);
    font-family: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  }
  .editions button {
    font: inherit; font-size: 17px; line-height: 1; color: var(--ink);
    background: none; border: 0; padding: 7px 13px 8px; border-radius: 999px; cursor: pointer;
  }
  .editions button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-style: italic; }
  .editions button:focus-visible, .tweaks-toggle:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .closeup { position: fixed; left: max(18px, 3.4vmin); bottom: calc(max(18px, 3.4vmin) + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px;
    font-family: "Instrument Serif", "Iowan Old Style", Georgia, serif; color: var(--ink); }
  .closeup-btn { font: inherit; font-size: 17px; line-height: 1; color: var(--ink); cursor: pointer; border: 0; border-radius: 999px; padding: 10px 16px 11px;
    background: color-mix(in srgb, var(--paper) 88%, transparent); box-shadow: 0 0 0 1px rgba(61, 85, 136, .25); }
  .closeup-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-style: italic; }
  .closeup-btn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .closeup-hint { font-size: 15px; font-style: italic; padding: 6px 10px; border-radius: 999px; background: color-mix(in srgb, var(--paper) 80%, transparent); }
  .closeup-hint[hidden] { display: none; }
  .tweaks-toggle {
    position: fixed; right: max(18px, 3.4vmin); bottom: calc(max(18px, 3.4vmin) + 52px + env(safe-area-inset-bottom, 0px));
    font-family: "Instrument Serif", "Iowan Old Style", Georgia, serif; font-size: 16px; line-height: 1; color: var(--ink);
    background: color-mix(in srgb, var(--paper) 88%, transparent); border: 0; border-radius: 999px;
    box-shadow: 0 0 0 1px rgba(61, 85, 136, .25); padding: 8px 14px 9px; cursor: pointer;
  }
  .tweaks-toggle[aria-expanded="true"] { background: var(--ink); color: var(--paper); font-style: italic; }
  .tweaks {
    position: fixed; right: max(18px, 3.4vmin); bottom: calc(max(18px, 3.4vmin) + 98px + env(safe-area-inset-bottom, 0px));
    width: min(280px, calc(100vw - 36px)); max-height: calc(100vh - 160px); overflow-y: auto; box-sizing: border-box;
    padding: 14px 16px 12px; border-radius: 14px;
    background: color-mix(in srgb, var(--paper) 94%, transparent); box-shadow: 0 0 0 1px rgba(61, 85, 136, .22), 0 10px 30px rgba(40, 20, 10, .12);
    font-family: "Instrument Serif", "Iowan Old Style", Georgia, serif; color: var(--ink);
  }
  .tweaks[hidden], .tweaks-toggle[hidden] { display: none; }
  .tweak { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 8px; margin-bottom: 8px; }
  .tweak label { font-size: 16px; }
  .tweak output { font-size: 14px; font-variant-numeric: tabular-nums; opacity: .7; }
  .tweak input[type=range] { grid-column: 1 / -1; width: 100%; margin: 2px 0 0; accent-color: var(--red); }
  .tweak.dim { opacity: .4; }
  .tweak-row { display: flex; justify-content: space-between; align-items: center; margin: 2px 0 10px; font-size: 16px; }
  .tweak-row input { accent-color: var(--ink); width: 16px; height: 16px; margin: 0 0 0 8px; }
  .tweaks .reset { font: inherit; font-size: 15px; color: var(--ink); background: none; border: 0; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .tweaks input:focus-visible, .tweaks .reset:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
</style>
</head>
<body>
<button class="tweaks-toggle" type="button" aria-expanded="false" aria-controls="tweaks" hidden>Gouache settings</button>
<div class="tweaks" id="tweaks" hidden></div>
<div class="closeup"><button class="closeup-btn" type="button" aria-pressed="false">Up close</button><span class="closeup-hint" hidden>Drag to orbit, scroll to zoom</span></div>
<div class="editions" role="group" aria-label="Edition">
  <button data-mode="0" aria-pressed="true">Riso</button>
  <button data-mode="1" aria-pressed="false">Gouache</button>
  <button data-mode="2" aria-pressed="false">Raw 3D</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script>
(() => {
  // ================= utilities =================
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = mulberry32(11);
  const R = (a, b) => a + (b - a) * rnd();
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const Y = V(0, 1, 0);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const L = V(-0.8, 0.6, 0.45).normalize();   // painted light: from the left, slightly in front
  const col = h => new THREE.Color(h);
  function ramp(cols, v) {
    v = Math.min(1, Math.max(0, v));
    const n = cols.length - 1, i = Math.min(n - 1, Math.floor(v * n)), f = v * n - i;
    return cols[i].clone().lerp(cols[i + 1], f);
  }

  const lineOnly = [];   // smooth proxies that only exist for keyline extraction
  const colourOnly = []; // things that should never produce keylines (sky, sea, leaves...)

  function bake(geo, cols, speck = 0.18, lift = 0) {
    const n = geo.attributes.normal, c = new Float32Array(n.count * 3);
    const cs = cols.map(col);
    for (let i = 0; i < n.count; i++) {
      let v = 0.5 * (n.getX(i) * L.x + n.getY(i) * L.y + n.getZ(i) * L.z) + 0.3 * n.getY(i) + 0.4 + lift + (rnd() - 0.5) * speck;
      const k = ramp(cs, v); c[i * 3] = k.r; c[i * 3 + 1] = k.g; c[i * 3 + 2] = k.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(c, 3));
    return geo;
  }
  const paintMat = new THREE.MeshBasicMaterial({ vertexColors: true });
  function blob(r, pos, sy = 0.55, lump = 0.18, seg = 18, sz = 1) {
    const g = new THREE.SphereGeometry(1, seg, Math.round(seg * 0.66));
    const p = g.attributes.position, s1 = R(0, 10), s2 = R(0, 10);
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const k = 1 + lump * (Math.sin(x * 4 + s1) * Math.sin(y * 5 + s2) * Math.sin(z * 4.5 + s1 * 0.7) + 0.5 * Math.sin(x * 9 + z * 7 + s2));
      p.setXYZ(i, x * k, y * k, z * k);
    }
    g.scale(r, r * sy, r * sz); g.translate(pos.x, pos.y, pos.z); g.computeVertexNormals();
    return g;
  }

  // ================= renderer / scene =================
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camBase = V(-0.4, 4.0, 22), lookBase = V(0, 7.2, -20);
  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 1200);
  camera.position.copy(camBase); camera.lookAt(lookBase);

  // ---------- sky ----------
  const sunDist = 380, sunRadius = 30, sunElev = Math.atan(sunRadius / sunDist) * 0.82;
  const sunDir = V(0, Math.sin(sunElev), -Math.cos(sunElev)).normalize();
  const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, uniforms: { uSun: { value: sunDir } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 uSun; varying vec3 vDir;
      void main(){
        float h = vDir.y;
        vec3 c = mix(vec3(0.97,0.74,0.52), vec3(0.90,0.80,0.64), smoothstep(0.0,0.05,h));
        c = mix(c, vec3(0.52,0.69,0.76), smoothstep(0.04,0.22,h));
        c = mix(c, vec3(0.25,0.47,0.64), smoothstep(0.2,0.62,h));
        float s = max(dot(normalize(vDir), uSun), 0.0);
        c += vec3(0.2,0.06,0.0) * pow(s, 40.0) * smoothstep(0.2, 0.0, h);
        gl_FragColor = vec4(c, 1.0);
      }`
  }));
  sky.renderOrder = -10; scene.add(sky); colourOnly.push(sky);

  const sunPos = camBase.clone().add(sunDir.clone().multiplyScalar(sunDist));
  const sun = new THREE.Mesh(new THREE.CircleGeometry(sunRadius, 96), new THREE.ShaderMaterial({
    vertexShader: `varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `varying vec2 vP; void main(){ float t = vP.y/${sunRadius.toFixed(1)}*0.5+0.5; gl_FragColor = vec4(mix(vec3(0.86,0.24,0.14), vec3(0.95,0.38,0.2), t),1.0); }`
  }));
  sun.position.copy(sunPos); sun.lookAt(camBase); scene.add(sun); colourOnly.push(sun);

  function ridge(x0, x1, z, hMin, hMax, color, seed) {
    const r2 = mulberry32(seed), s = new THREE.Shape();
    s.moveTo(x0, -1);
    for (let i = 0; i <= 60; i++) {
      const t = i / 60, x = x0 + (x1 - x0) * t, env = Math.sin(Math.PI * t) ** 0.6;
      s.lineTo(x, -0.8 + env * (hMin + (hMax - hMin) * (0.5 + 0.5 * Math.sin(t * 9 + seed) * Math.cos(t * 4.3)) + r2() * 0.4));
    }
    s.lineTo(x1, -1);
    const m = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshBasicMaterial({ color }));
    m.position.z = z; scene.add(m); colourOnly.push(m);
  }
  ridge(-190, -36, -300, 2.5, 6.5, 0x9db1bb, 3);
  ridge(34, 150, -320, 1.5, 4.0, 0xb4c1c3, 11);

  // ---------- sea ----------
  const cosSun = Math.cos(Math.atan(sunRadius / sunDist));
  const seaMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uSun: { value: sunDir }, uCam: { value: camera.position }, uCos: { value: cosSun } },
    vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `uniform float uTime, uCos; uniform vec3 uSun, uCam; varying vec3 vW;
      void main(){
        vec3 V = normalize(vW - uCam); float dist = length(vW.xz - uCam.xz); vec2 p = vW.xz; float t = uTime;
        vec3 n = normalize(vec3(0.02*sin(p.x*0.35+t*0.6)+0.012*sin(p.x*1.3-p.y*0.4+t), 1.0, 0.035*sin(p.y*0.45+t*0.8)+0.02*sin(p.y*1.7+p.x*0.3-t*1.2)));
        vec3 Rf = reflect(V, n);
        vec3 c = mix(vec3(0.36,0.72,0.78), vec3(0.17,0.47,0.66), smoothstep(30.0,70.0,dist));
        c = mix(c, vec3(0.30,0.52,0.66), smoothstep(110.0,240.0,dist));
        c = mix(c, vec3(0.80,0.76,0.68), smoothstep(260.0,520.0,dist));
        float s = dot(Rf, uSun);
        c = mix(c, vec3(0.92,0.45,0.32), smoothstep(uCos-0.004, uCos+0.0008, s)*0.42);
        gl_FragColor = vec4(c,1.0);
      }`
  });
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(2000, 1200), seaMat);
  sea.rotation.x = -Math.PI / 2; sea.position.set(0, -0.9, -600); scene.add(sea); colourOnly.push(sea);
  const foam = new THREE.Mesh(new THREE.PlaneGeometry(80, 0.5), new THREE.MeshBasicMaterial({ color: 0xe6eee8, transparent: true, opacity: 0.75 }));
  foam.rotation.x = -Math.PI / 2; foam.position.set(0, -0.88, -14.4); scene.add(foam); colourOnly.push(foam);

  // ---------- lights ----------
  const hemi = new THREE.HemisphereLight(0xb8cfd8, 0xc89a6a, 0.62); hemi.layers.enable(5); scene.add(hemi);
  const key = new THREE.DirectionalLight(0xffe0bc, 0.85);
  key.position.set(-28, 22, 14); key.target.position.set(0, 0, -6);
  key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 90 });
  key.shadow.bias = -0.0008; key.shadow.radius = 3;
  key.layers.enable(5);
  scene.add(key, key.target);

  // ---------- terrace + pool ----------
  function stoneTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = '#ddc7a7'; g.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 9000; i++) { const v = 190 + Math.floor(rnd() * 40); g.fillStyle = `rgba(${v + 25},${v + 8},${v - 18},0.16)`; g.fillRect(rnd() * 512, rnd() * 512, 2, 2); }
    g.strokeStyle = 'rgba(150,120,90,0.12)'; g.lineWidth = 2;
    for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(0, i * 128); g.lineTo(512, i * 128); g.stroke(); }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
  }
  const stoneTex = stoneTexture();
  function slab(x0, x1, z0, z1, y0 = -2.2, y1 = 0) {
    const w = x1 - x0, d = z1 - z0, t = stoneTex.clone(); t.needsUpdate = true; t.repeat.set(w / 6, d / 6);
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, y1 - y0, d), new THREE.MeshLambertMaterial({ map: t }));
    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); m.receiveShadow = true; scene.add(m);
  }
  const PW = 3.6, poolFar = -11.6, terraceEdge = -14;
  slab(-40, -PW, terraceEdge, 30); slab(PW, 40, terraceEdge, 30);
  slab(-PW, PW, terraceEdge, poolFar); slab(-PW, PW, 26, 30);
  const lining = new THREE.Mesh(new THREE.BoxGeometry(PW * 2, 0.1, 26 - poolFar), new THREE.MeshBasicMaterial({ color: 0x0d2a33 }));
  lining.position.set(0, -2.1, (26 + poolFar) / 2); scene.add(lining);

  const PoolShader = {
    uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, uTime: { value: 0 } },
    vertexShader: `uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vP;
      void main(){ vUv = textureMatrix*vec4(position,1.0); vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 color; uniform sampler2D tDiffuse; uniform float uTime; varying vec4 vUv; varying vec3 vP;
      void main(){
        vec2 d = vec2(sin(vP.y*2.6+uTime*1.1)+0.5*sin(vP.x*4.0-uTime*0.7), sin(vP.y*1.9-uTime*0.8))*0.0012;
        vec4 uv = vUv; uv.xy += d*uv.w;
        vec3 base = texture2DProj(tDiffuse, uv).rgb;
        float near = smoothstep(-14.0, 14.0, vP.y);   // darker water toward the viewer
        vec3 deep = vec3(0.05,0.2,0.26);
        vec3 c = mix(base*color, deep, 0.18 + 0.32*near);
        gl_FragColor = vec4(c,1.0);
      }`
  };
  const pool = new THREE.Reflector(new THREE.PlaneGeometry(PW * 2, 26 - poolFar), {
    clipBias: 0.003, textureWidth: 1024, textureHeight: 1024, color: 0xbfd8dc, shader: PoolShader
  });
  pool.rotation.x = -Math.PI / 2; pool.position.set(0, -0.16, (26 + poolFar) / 2);
  scene.add(pool); colourOnly.push(pool);
  // flat stand-in for the water so keylines see a surface, not the pit underneath
  { const wp = new THREE.Mesh(new THREE.PlaneGeometry(PW * 2, 26 - poolFar)); wp.rotation.x = -Math.PI / 2; wp.position.copy(pool.position); wp.visible = false; scene.add(wp); lineOnly.push(wp); }

  // ---------- wall ----------
  const archR = 8.6, archSpring = 4.8, wallDepth = 1.8;
  const ws = new THREE.Shape();
  ws.moveTo(-60, -2.2); ws.lineTo(-archR, -2.2); ws.lineTo(-archR, archSpring);
  ws.absarc(0, archSpring, archR, Math.PI, 0, true);
  ws.lineTo(archR, -2.2); ws.lineTo(60, -2.2); ws.lineTo(60, 40); ws.lineTo(-60, 40); ws.lineTo(-60, -2.2);
  const wall = new THREE.Mesh(new THREE.ExtrudeGeometry(ws, { depth: wallDepth, bevelEnabled: false, curveSegments: 96 }), new THREE.MeshLambertMaterial({ color: 0xc23a2c }));
  wall.receiveShadow = true; scene.add(wall);

  // ================= foliage system =================
  // Everything leafy is thousands of small instanced clumps with baked colour,
  // plus a smooth invisible proxy per mass so keylines describe shapes, not leaves.
  const leaves = [];
  const proxyMat = new THREE.MeshBasicMaterial();
  function proxy(geo) { const m = new THREE.Mesh(geo, proxyMat); m.visible = false; scene.add(m); lineOnly.push(m); }
  function leaf(pos, s, c, rotY = R(0, 6.28), sy = 0.6) { leaves.push({ pos, s, c, rotY, sy }); }

  const PINE = ['#202a0f', '#4a5a1c', '#7f8f30', '#b7b452', '#e2d978'].map(col);
  const UNDER = ['#10160a', '#202a10', '#3a4818'];
  const TRUNK = ['#120e0b', '#33271e', '#6a5444'];

  function chain(group, pts, r0, r1) {
    const n = pts.length - 1;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[i + 1], dir = b.clone().sub(a), len = dir.length(); dir.normalize();
      const rA = r0 + (r1 - r0) * (i / n), rB = r0 + (r1 - r0) * ((i + 1) / n);
      const g = new THREE.CylinderGeometry(rB, rA, len, 12, 4, true);
      const p = g.attributes.position;   // a little bark irregularity
      for (let k = 0; k < p.count; k++) { const w = 1 + 0.08 * Math.sin(p.getY(k) * 6 + k); p.setX(k, p.getX(k) * w); p.setZ(k, p.getZ(k) * w); }
      g.translate(0, len / 2, 0);
      g.applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(Y, dir)));
      g.translate(a.x, a.y, a.z); g.computeVertexNormals();
      const m = new THREE.Mesh(bake(g, TRUNK, 0.08), paintMat); m.castShadow = true; group.add(m);
      const j = new THREE.SphereGeometry(rB, 10, 8); j.translate(b.x, b.y, b.z);
      const jm = new THREE.Mesh(bake(j, TRUNK, 0.08), paintMat); jm.castShadow = true; group.add(jm);
    }
  }

  // umbrella pine crown: overlapping flat pads, each a dense sunlit top over a dark underside
  function crown(c, rad, nPads = 6) {
    const pads = [{ x: c.x, y: c.y + rad * 0.1, z: c.z, r: rad * 0.6 }];
    for (let i = 0; i < nPads; i++) {
      const a = i / nPads * Math.PI * 2 + R(-0.35, 0.35), d = rad * R(0.42, 0.68);
      pads.push({ x: c.x + Math.cos(a) * d, y: c.y + R(-0.16, 0.08) * rad, z: c.z + Math.sin(a) * d * 0.7, r: rad * R(0.36, 0.52) });
    }
    pads.forEach(p => {
      const under = new THREE.Mesh(bake(blob(p.r * 0.96, V(p.x, p.y, p.z), 0.2, 0.12, 20, 0.78), UNDER, 0.2), paintMat);
      under.castShadow = true; scene.add(under);
      const count = Math.max(70, Math.min(480, Math.round(170 * p.r * p.r)));
      for (let i = 0; i < count; i++) {
        const a = R(0, Math.PI * 2), rr = p.r * Math.sqrt(rnd()), u = rr / p.r, dome = 1 - u * u;
        const pos = V(p.x + Math.cos(a) * rr, p.y + p.r * (0.06 + 0.2 * dome) - Math.pow(rnd(), 2.2) * p.r * 0.2, p.z + Math.sin(a) * rr * 0.78);
        const n = V(Math.cos(a) * u * 0.9, 0.45 + 0.55 * dome, Math.sin(a) * u * 0.9).normalize();
        const v = 0.62 * n.dot(L) + 0.38 + 0.25 * dome + (rnd() - 0.5) * 0.35;
        leaf(pos, p.r * R(0.075, 0.13), ramp(PINE, v));
      }
      const pg = new THREE.SphereGeometry(1, 28, 14); pg.scale(p.r * 1.0, p.r * 0.26, p.r * 0.8); pg.translate(p.x, p.y + p.r * 0.02, p.z);
      proxy(pg);
    });
  }
  function pine(trunkPts, r0, r1, crowns) {
    const g = new THREE.Group();
    chain(g, trunkPts, r0, r1);

        push.set(Math.sin(d.heading) * spd, 0, Math.cos(d.heading) * spd);
      } else { push.multiplyScalar(0.5); if (push.length() < 0.1) push.set(0, 0, 0); }
      d.vel.lerp(push, 1 - Math.pow(0.02, dt));
      const sp = d.vel.length(), w = Math.min(1, sp / 0.45);   // (drops)
      // walk on two little legs: planted feet, body rides the steps
      d.pos.addScaledVector(d.vel, dt);
      d.pos.z = Math.max(-13.6, Math.min(16, d.pos.z)); d.pos.x = Math.max(-13, Math.min(13, d.pos.x));
      d.root.position.set(d.pos.x, 0, d.pos.z);
      d.root.rotation.y = d.heading;
      const stp = stepLegs(d, d.legs, dt, { spread: 0.1, lift: 0.06, dur: 0.2 });
      if (stp.landed) d.dip = 1;
      d.dip = Math.max(0, (d.dip || 0) - dt * 7);
      d.sway = (d.sway || 0) + ((stp.swinging ? -stp.swinging.sd : 0) - (d.sway || 0)) * Math.min(1, dt * 10);
      const rise = stp.swinging ? Math.sin(Math.PI * stp.swinging.t) : 0;
      const st = 1 - 0.06 * Math.sin(d.dip * Math.PI) + 0.03 * rise + Math.sin(t * 1.9 + d.fidget) * 0.015 * (1 - w);
      d.body.scale.set(1 / Math.sqrt(st), st, 1 / Math.sqrt(st));
      d.body.position.set(0, d.LH - 0.02 * Math.sin(d.dip * Math.PI) + 0.018 * rise, 0);
      d.body.rotation.set(0.08 * w, 0, -d.sway * 0.06 * Math.max(w, 0.4) + (1 - w) * Math.sin(t * 0.8 + d.fidget) * 0.03);
      poseLegs(d, d.legs, f => V(f.sd * 0.09, d.body.position.y + 0.05, 0));
      d.stride = (d.stride || 0) + (stp.swinging ? dt / stp.swinging.dur * Math.PI : 0);
      d.arms.forEach((a, j) => { const sd = j === 0 ? -1 : 1; a.rotation.x = sd * Math.sin(d.stride) * 0.5 * w; a.rotation.z = sd * 0.25 + Math.sin(t * 1.3 + j) * 0.04; });
      d.blob.position.set(d.pos.x, 0.015, d.pos.z); d.blob.scale.setScalar(d.sc * 0.75);
      // eyes: relaxed dashes; blink thinner; they pop open into round dots when surprised (a close bump)
      d.nextBlink -= dt;
      if (d.nextBlink <= 0) { d.blink = 0.14; d.nextBlink = rnd() < 0.2 ? 0.3 : R(2.5, 6.5); }
      d.blink = Math.max(0, d.blink - dt);
      if (!moving && d.wait > 0 && rnd() < dt * 0.05) d.wide = 1.2;            // the odd startled look
      others.forEach(o => { if (o !== d && Math.hypot(d.pos.x - o.pos.x, d.pos.z - o.pos.z) < 0.55) d.wide = 0.8; });
      d.wide = Math.max(0, d.wide - dt);
      const eyeY = d.blink > 0 ? 0.35 : d.wide > 0 ? 2.6 : 1;
      d.eyes.forEach(e => { e.scale.y += (eyeY - e.scale.y) * Math.min(1, dt * 18); e.scale.x = d.wide > 0 ? 0.8 : 1; });
    });
  }

  function updateHoppers(dt, t) {
    hoppers.forEach(h => {
      const sc = h.sc;
      // decide where the next hop should go: toward the path, nudged away from neighbours and obstacles
      const goal = h.wait <= 0 && h.path.length ? h.path[0] : null;
      if (h.wait > 0) {
        h.wait -= dt;
        if (h.wait <= 0) pickTarget(h);
        h.lookSwap -= dt;
        if (h.lookSwap <= 0) { h.lookViewer = !h.lookViewer && rnd() < 0.5; h.lookSwap = h.lookViewer ? R(1.5, 3) : R(5, 14); }
      } else if (goal && Math.hypot(goal.x - h.pos.x, goal.z - h.pos.z) < 0.45) {
        h.path.shift(); if (!h.path.length) h.wait = R(3, 12);
      }
      h.st += dt;
      if (h.state === 'rest') {
        // turn on the spot toward where it wants to go (or toward you / the sun when idle)
        let want;
        if (h.wait <= 0 && h.path.length) want = Math.atan2(h.path[0].x - h.pos.x, h.path[0].z - h.pos.z);
        else want = (h.lookViewer || closeUp) ? Math.atan2(camera.position.x - h.pos.x, camera.position.z - h.pos.z) : Math.PI;
        h.heading += wrapAngle(want - h.heading) * Math.min(1, dt * 6);
        const pause = h.wait > 0 ? R(1.5, 4) : 0.12;
        if (h.st > (h.pauseFor ?? pause)) {
          if (h.wait <= 0 && h.path.length) { h.state = 'crouch'; h.st = 0; }
          else if (rnd() < dt * 0.4) { h.state = 'crouch'; h.st = 0; h.inPlace = true; }   // the odd happy hop on the spot
        }
      } else if (h.state === 'crouch' && h.st > 0.11) {
        const goalP = h.path[0];
        const dir = V(Math.sin(h.heading), 0, Math.cos(h.heading));
        if (goalP && !h.inPlace) {
          dir.set(goalP.x - h.pos.x, 0, goalP.z - h.pos.z).normalize();
          // personal space and obstacles
          [...creatures, ...hoppers, ...drops, ...scoots, ...pips].forEach(o => {
            if (o === h) return;
            const dx = h.pos.x - o.pos.x, dz = h.pos.z - o.pos.z, dd = Math.hypot(dx, dz);
            if (dd < 1.3 && dd > 1e-4) { dir.x += dx / dd * (1.3 - dd) * 1.5; dir.z += dz / dd * (1.3 - dd) * 1.5; }
          });
          OBST.forEach(o => { const dx = h.pos.x - o[0], dz = h.pos.z - o[1], dd = Math.hypot(dx, dz), r = o[2] + 0.5; if (dd < r && dd > 1e-4) { dir.x += dx / dd * 2; dir.z += dz / dd * 2; } });
          if (h.pos.z > -12.2 && Math.abs(h.pos.x) < PW + 0.8) dir.x += Math.sign(h.pos.x || 1) * 2;
          dir.normalize();
          h.heading = Math.atan2(dir.x, dir.z);
        }
        const len = h.inPlace ? 0 : Math.min(R(0.55, 0.8) * Math.sqrt(sc), goalP ? Math.hypot(goalP.x - h.pos.x, goalP.z - h.pos.z) + 0.1 : 0.6);
        h.from.copy(h.pos); h.to.copy(h.pos).addScaledVector(dir, len);
        h.to.z = Math.max(-13.6, Math.min(16, h.to.z)); h.to.x = Math.max(-13, Math.min(13, h.to.x));
        h.air = h.inPlace ? 0.42 : 0.34 + len * 0.12; h.hopH = (h.inPlace ? 0.42 : 0.26 + len * 0.18) * sc;
        h.state = 'air'; h.st = 0; h.sqV = 3.5;
      } else if (h.state === 'air') {
        const u = Math.min(1, h.st / h.air);
        h.pos.lerpVectors(h.from, h.to, u);
        if (u >= 1) { h.state = 'land'; h.st = 0; h.squash = 0.72; h.inPlace = false; }
      } else if (h.state === 'land' && h.st > 0.12) {
        h.state = 'rest'; h.st = 0; h.pauseFor = h.wait > 0 ? R(1.5, 4) : R(0.05, 0.22);
      }
      // squash & stretch spring: crouch squashes, launch stretches, landing squashes, then it settles
      let target = 1;
      if (h.state === 'crouch') target = 0.76;
      if (h.state === 'air') { const u = h.st / h.air; target = 1.16 - 0.22 * Math.sin(Math.PI * u); }
      h.sqV += (target - h.squash) * 260 * dt; h.sqV *= Math.pow(0.0015, dt); h.squash += h.sqV * dt;
      const sq = Math.max(0.6, h.squash);
      h.body.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
      const y = h.state === 'air' ? Math.sin(Math.PI * Math.min(1, h.st / h.air)) * h.hopH : 0;
      h.root.position.set(h.pos.x, y, h.pos.z);
      h.root.rotation.y = h.heading;
      // stand on two short legs: legs bend in the crouch, dangle in the air, feet land under the hips
      const bodyLift = h.LH * (h.state === 'crouch' ? 0.45 : h.state === 'land' ? 0.6 : 1);
      h.lift = (h.lift ?? h.LH) + (bodyLift - (h.lift ?? h.LH)) * Math.min(1, dt * 20);
      h.body.position.y = h.lift;
      const hs = Math.sin(h.heading), hc = Math.cos(h.heading);
      h.legs.forEach(f => {
        f.home.set(h.pos.x + hc * f.sd * 0.12 * sc, 0, h.pos.z - hs * f.sd * 0.12 * sc);
        if (h.state !== 'air') f.pos.copy(f.home);
      });
      h.legs.forEach(f => { if (h.state === 'air') f.pos.copy(f.home); });
      poseLegs(h, h.legs, f => V(f.sd * 0.12, h.lift + 0.05, 0),
        f => h.state === 'air' ? Math.max(0, y + (h.lift - h.LH * 0.95 + Math.sin(t * 9 + f.sd) * 0.012) * sc) : 0);
      h.body.rotation.x = h.state === 'air' ? 0.18 * Math.cos(Math.PI * h.st / h.air) : 0;   // tips forward on the way down
      h.body.rotation.z = h.state === 'rest' ? Math.sin(t * 1.1 + h.fidget) * 0.03 : 0;
      h.blob.position.set(h.pos.x, 0.015, h.pos.z); h.blob.scale.setScalar(sc * 0.85 * (1 - Math.min(0.5, y * 0.8)));
      // face: blink, an "o" mouth mid-air
      h.nextBlink -= dt;
      if (h.nextBlink <= 0) { h.blink = 0.13; h.nextBlink = rnd() < 0.2 ? 0.26 : R(2, 6); }
      h.blink = Math.max(0, h.blink - dt);
      h.eyes.forEach(e => e.scale.y = h.blink > 0 ? 0.12 : 1);
      const airborne = h.state === 'air';
      h.smile.visible = !airborne; h.oMouth.visible = airborne;
    });
  }

  // occasional happy bounce while waiting
  const wrapAngle = a => Math.atan2(Math.sin(a), Math.cos(a));
  const tmpV = V(0, 0, 0), push = V(0, 0, 0);
  function updateCreatures(dt, t) {
    creatures.forEach(c => {
      let moving = false;
      push.set(0, 0, 0);
      if (c.wait > 0) {
        c.wait -= dt;
        if (c.wait <= 0) pickTarget(c);
        c.vel.multiplyScalar(Math.pow(0.02, dt));
        if (c.hop <= 0 && rnd() < dt * 0.05) c.hop = 0.45;
        // idle: drift to face the sun, with the odd glance around
        c.lookSwap -= dt;
        if (c.lookSwap <= 0) { c.lookViewer = !c.lookViewer && rnd() < 0.5; c.lookSwap = c.lookViewer ? R(1.5, 3) : R(6, 16); }
        const toViewer = Math.atan2(camera.position.x - c.pos.x, camera.position.z - c.pos.z);
        const look = ((c.lookViewer || closeUp) ? toViewer : Math.PI) + Math.sin(t * 0.3 + c.fidget) * 0.25;
        c.heading += wrapAngle(look - c.heading) * Math.min(1, dt * 2);
      } else {
        const goal = c.path[0];
        tmpV.set(goal.x - c.pos.x, 0, goal.z - c.pos.z);
        const d = tmpV.length();
        if (d < 0.4) { c.path.shift(); if (!c.path.length) { c.wait = R(4, 14); c.hop = 0.45; } }
        else push.addScaledVector(tmpV, c.speed * (c.path.length === 1 ? Math.min(1, 0.35 + d / 1.2) : 1) / d);
        moving = true;
      }
      // keep a little personal space (from both species)
      [...hoppers, ...drops, ...scoots, ...pips].forEach(o => {
        const dx = c.pos.x - o.pos.x, dz = c.pos.z - o.pos.z, dd = dx * dx + dz * dz;
        if (dd < 1.8 && dd > 1e-5) { const k = (1.35 - Math.sqrt(dd)) * 3; push.x += dx * k; push.z += dz * k; }
      });
      creatures.forEach(o => {
        if (o === c) return;
        const dx = c.pos.x - o.pos.x, dz = c.pos.z - o.pos.z, dd = dx * dx + dz * dz;
        if (dd < 2.1 && dd > 1e-5) { const k = (1.45 - Math.sqrt(dd)) * 3; push.x += dx * k; push.z += dz * k; }
      });
      OBST.forEach(o => {
        const dx = c.pos.x - o[0], dz = c.pos.z - o[1], dd = Math.hypot(dx, dz), r = o[2] + 0.55;
        if (dd < r && dd > 1e-4) { const k = (r - dd) * 6 / dd; push.x += dx * k; push.z += dz * k; }
      });
      if (c.pos.z > -12.2 && c.pos.z < 26 && Math.abs(c.pos.x) < PW + 0.6) push.x += Math.sign(c.pos.x || 1) * (PW + 0.6 - Math.abs(c.pos.x)) * 10;
      if (c.pos.z > -0.4 && c.pos.z < 2.2 && Math.abs(c.pos.x) > 8.0) push.x -= Math.sign(c.pos.x) * (Math.abs(c.pos.x) - 8.0) * 10;
      // ---- locomotion: they always walk the way they face (no sliding sideways) ----
      if (moving) {
        const dl = Math.hypot(push.x, push.z), want = Math.atan2(push.x, push.z);
        const turn = wrapAngle(want - c.heading);
        c.heading += turn * Math.min(1, dt * 5);
        const spd = Math.min(dl, c.speed) * Math.max(0.2, Math.cos(turn));   // ease off while turning sharply
        tmpV.set(Math.sin(c.heading) * spd, 0, Math.cos(c.heading) * spd);
        c.vel.lerp(tmpV, 1 - Math.pow(0.02, dt));
      } else {
        tmpV.set(push.x * 0.5, 0, push.z * 0.5);                             // standing: just shuffle out of the way
        if (tmpV.length() < 0.12) tmpV.set(0, 0, 0);
        c.vel.lerp(tmpV, 1 - Math.pow(0.01, dt));
      }
      c.pos.addScaledVector(c.vel, dt);
      c.pos.z = Math.max(-13.6, Math.min(16, c.pos.z)); c.pos.x = Math.max(-13, Math.min(13, c.pos.x));
      const sp = c.vel.length(), w = Math.min(1, sp / 0.6), sc = c.root.scale.x;

      c.hop = Math.max(0, c.hop - dt);
      const hk = c.hop > 0 ? 1 - c.hop / 0.45 : 0;
      const hopY = c.hop > 0 ? Math.sin(hk * Math.PI) * 0.26 : 0;
      c.root.position.set(c.pos.x, hopY, c.pos.z);
      c.root.rotation.y = c.heading;
      c.blob.position.set(c.pos.x, 0.015, c.pos.z); c.blob.scale.setScalar(sc * (1 - Math.min(0.45, hopY)));

      // ---- feet: planted on the ground, one steps at a time toward a spot under the hip ----
      const side = V(Math.cos(c.heading), 0, -Math.sin(c.heading));
      c.legs.forEach(f => {
        f.home = f.home || V();
        f.home.copy(c.pos).addScaledVector(side, f.sd * 0.12 * sc).addScaledVector(c.vel, 0.14);
        if (!c.placed) { f.pos.copy(f.home); f.t = 1; }
      });
      c.placed = true;
      if (c.hop > 0) {
        c.legs.forEach(f => { f.pos.copy(f.home); f.t = 1; f.lift = 0; });   // feet tucked under during a hop
      } else {
        if (c.legs.every(f => f.t >= 1)) {
          let best = null, bd = 0;
          c.legs.forEach(f => { const d = Math.hypot(f.pos.x - f.home.x, f.pos.z - f.home.z); if (d > bd) { bd = d; best = f; } });
          if (best && bd > (sp > 0.1 ? 0.045 : 0.03) * sc) {
            best.from.copy(best.pos); best.to.copy(best.home).addScaledVector(c.vel, 0.1);
            best.t = 0; best.dur = THREE.MathUtils.clamp(0.19 - sp * 0.05, 0.11, 0.19);
          }
        }
        c.legs.forEach(f => {
          if (f.t < 1) {
            f.t = Math.min(1, f.t + dt / f.dur);
            const e = f.t * f.t * (3 - 2 * f.t);
            f.pos.lerpVectors(f.from, f.to, e);
            f.lift = Math.sin(Math.PI * f.t) * 0.065 * sc;
            if (f.t >= 1) { c.dip = 1; f.lift = 0; }     // foot lands: body dips a little
          }
        });
      }
      const swinging = c.legs.find(f => f.t < 1);
      c.dip = Math.max(0, c.dip - dt * 7);
      c.sway += ((swinging ? -swinging.sd : 0) - c.sway) * Math.min(1, dt * 10);   // lean over the supporting foot
      c.stride += (swinging ? 1 : 0) * dt / (swinging ? swinging.dur : 1) * Math.PI;

      // ---- body: rides on top of the steps ----
      const breathe = Math.sin(t * 2.2 + c.fidget) * 0.02 * (1 - w);
      const rise = swinging ? Math.sin(Math.PI * swinging.t) : 0;
      let st = 1 - 0.07 * Math.sin(c.dip * Math.PI) + 0.03 * rise + breathe;
      if (c.hop > 0) st *= hk < 0.15 ? 0.84 : hk > 0.85 ? 0.9 : 1.08;   // crouch, stretch, land
      c.body.scale.set(1 / Math.sqrt(st), st, 1 / Math.sqrt(st));
      c.body.position.y = HIP + PUFF_R * 0.95 - 0.025 * Math.sin(c.dip * Math.PI) + 0.022 * rise;
      c.body.rotation.x = 0.12 * w;
      c.body.rotation.z = -c.sway * 0.07 * Math.max(w, 0.4) + (1 - w) * Math.sin(t * 0.9 + c.fidget) * 0.03 + c.tilt;

      // ---- legs: stretch from the hip (inside the body's underside) to each planted foot ----
      c.root.updateMatrixWorld(true);
      c.legs.forEach(f => {
        const hip = c.root.localToWorld(V(f.sd * 0.1, c.body.position.y - PUFF_R * 0.95 * st + 0.06, 0));
        const ankle = V(f.pos.x, f.lift + (c.hop > 0 ? hopY : 0) + 0.03 * sc, f.pos.z);
        const dir = hip.clone().sub(ankle), len = Math.max(0.01, dir.length());
        f.leg.position.copy(ankle);
        f.leg.quaternion.setFromUnitVectors(Y, dir.divideScalar(len));
        f.leg.scale.set(sc, len, sc);
        f.foot.position.copy(ankle);
        f.foot.rotation.set(0, c.heading, 0);
        f.foot.scale.setScalar(sc);
      });

      // arms swing against the stepping foot; up in a little cheer on hops, a slow idle sway otherwise
      const cheer = c.hop > 0 ? 1 : 0;
      c.arms.forEach((a, j) => {
        const sd = j === 0 ? -1 : 1;
        a.rotation.x = sd * Math.sin(c.stride) * 0.6 * w;
        const zT = sd * (0.3 + cheer * 2.1 + (1 - w) * 0.06 * Math.sin(t * 1.6 + c.fidget + j));
        a.rotation.z += (zT - a.rotation.z) * Math.min(1, dt * 12);
      });
      // ---- expression ----
      c.nextBlink -= dt;
      if (c.nextBlink <= 0) { c.blink = 0.13; c.nextBlink = rnd() < 0.2 ? 0.26 : R(2, 6); }   // sometimes a double blink
      c.blink = Math.max(0, c.blink - dt);
      c.moodT -= dt;
      if (c.moodT <= 0) { c.mood = IDLE_MOODS[Math.floor(rnd() * IDLE_MOODS.length)]; c.moodT = R(2.5, 7); }
      let moodName = moving && sp > 0.2 ? 'calm' : c.mood;
      if (!moving && c.lookViewer) moodName = 'content';
      if (c.hop > 0) moodName = 'happy';
      const M = MOODS[moodName], k = Math.min(1, dt * 10);
      c.sy += (M.sy - c.sy) * k;
      c.puffK += (M.puff - c.puffK) * Math.min(1, dt * (M.puff > c.puffK ? 14 : 4));   // puff up fast, deflate slowly
      c.puff.scale.setScalar(c.puffK);
      const closedHappy = moodName === 'happy' || moodName === 'content';
      const tiltT = moodName === 'curious' ? 0.2 * Math.sign(Math.sin(c.fidget * 7) || 1) : moodName === 'content' ? 0.1 * Math.sign(Math.cos(c.fidget * 5) || 1) : 0;
      c.tilt += (tiltT - c.tilt) * Math.min(1, dt * 5);
      c.arcs.forEach(a => a.visible = closedHappy);
      c.smile.scale.setScalar(closedHappy ? 1.2 : 1);
      c.eyes.forEach(e => { e.visible = !closedHappy; e.scale.y = c.blink > 0 ? 0.1 : c.sy; });
    });
    updateHoppers(dt, t);
    updateDrops(dt, t);
    updateScoots(dt, t);
    updateFlits(dt, t);
    updatePips(dt, t);
    updateFloaties(dt, t);
  }
  updateCreatures(0.016, 0);

  // ================= post-processing =================
  const GLSL_NOISE = `
    float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
    float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x), mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x), u.y); }
    float fbm(vec2 p){ float a=0.5, s=0.0; for(int i=0;i<4;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }
  `;
  const FS_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

  // 1. gouache: warped generalised Kuwahara, flattens the CG into brush-shaped patches
  // gouache for the creatures: alpha-aware brush patches on the bodies, a wobbly brushed silhouette,
  // pigment gathering toward the edges, and the faces kept legible on top (face pixels carry alpha 0.5)
  const folkPaintMat = new THREE.ShaderMaterial({
    uniforms: { tFolk: { value: null }, uRes: { value: new THREE.Vector2() }, uRadius: { value: 3 }, uWarp: { value: 2.5 } },
    vertexShader: FS_VERT,
    fragmentShader: GLSL_NOISE + `
      uniform sampler2D tFolk; uniform vec2 uRes; uniform float uRadius, uWarp; varying vec2 vUv;
      void main(){
        vec2 px = 1.0 / uRes;
        vec2 warp = (vec2(fbm(vUv * uRes / 12.0), fbm(vUv * uRes / 12.0 + 5.3)) - 0.5) * uWarp * px;
        vec4 cw = texture2D(tFolk, vUv + warp);
        if (cw.a < 0.9) {                       // face (0.5), soft shadow (<0.45) or nothing: pass through
          if (cw.a > 0.45) { gl_FragColor = vec4(cw.rgb, 0.5); return; }
          gl_FragColor = cw; return;
        }
        vec3 m0 = vec3(0.0), m1 = vec3(0.0), m2 = vec3(0.0), m3 = vec3(0.0);
        vec3 s0 = vec3(0.0), s1 = vec3(0.0), s2 = vec3(0.0), s3 = vec3(0.0);
        float n0 = 0.0, n1 = 0.0, n2 = 0.0, n3 = 0.0;

  const panel = document.getElementById('tweaks'), toggle = document.querySelector('.tweaks-toggle');
  const fmt = (k, v) => k === 'brush' ? String(v) : Number(v).toFixed(2);
  panel.innerHTML = '<div class="tweak-row"><label for="g-lines">Pencil lines</label><input id="g-lines" type="checkbox" checked></div>' +
    CONTROLS.map(([k, label, mn, mx, st]) => `<div class="tweak" data-k="${k}"><label for="g-${k}">${label}</label><output id="o-${k}"></output>` +
      `<input id="g-${k}" type="range" min="${mn}" max="${mx}" step="${st}"></div>`).join('') +
    '<button class="reset" type="button">Reset to defaults</button>';
  function applyG() {
    const u = printMat.uniforms;
    u.uSat.value = G.saturation; u.uWarm.value = G.warmth; u.uTooth.value = G.tooth; u.uPool.value = G.pooling;
    u.uLines.value = G.lines ? 1 : 0; u.uLineStr.value = G.lineStrength;
    CONTROLS.forEach(([k]) => {
      const inp = document.getElementById('g-' + k); inp.value = G[k];
      document.getElementById('o-' + k).textContent = fmt(k, G[k]);
    });
    document.getElementById('g-lines').checked = G.lines;
    panel.querySelectorAll('[data-k="lineWeight"], [data-k="lineStrength"]').forEach(el => el.classList.toggle('dim', !G.lines));
    dirty = true;
  }
  CONTROLS.forEach(([k]) => document.getElementById('g-' + k).addEventListener('input', e => { G[k] = parseFloat(e.target.value); applyG(); }));
  document.getElementById('g-lines').addEventListener('change', e => { G.lines = e.target.checked; applyG(); });
  panel.querySelector('.reset').addEventListener('click', () => { Object.assign(G, G_DEFAULT); applyG(); });
  toggle.addEventListener('click', () => {
    const open = toggle.getAttribute('aria-expanded') !== 'true';
    toggle.setAttribute('aria-expanded', String(open)); panel.hidden = !open;
  });
  function setLines(on) { G.lines = on; applyG(); }
  if (/nolines/.test(location.hash)) G.lines = false;
  applyG();
  function setMode(m) {
    mode = m; dirty = true;
    toggle.hidden = m !== 1; if (m !== 1) { panel.hidden = true; toggle.setAttribute('aria-expanded', 'false'); }
    else if (/settings/.test(location.hash)) { panel.hidden = false; toggle.setAttribute('aria-expanded', 'true'); }
    buttons.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.mode === m)));
    document.documentElement.style.background = m === 2 ? '#a92e25' : '';
  }
  buttons.forEach(b => b.addEventListener('click', () => setMode(+b.dataset.mode)));
  addEventListener('keydown', e => { if (e.target.closest && e.target.closest('.tweaks')) return; if (e.key === 'c' || e.key === 'C') setCloseUp(!closeUp); if (e.key === '1' || e.key === '2' || e.key === '3') setMode(+e.key - 1); if ((e.key === 'l' || e.key === 'L') && mode === 1) setLines(!G.lines); });

  // ================= render =================
  // the slow part: paint the world (held frames)
  function renderWorld() {
    const gouache = mode === 1;
    renderer.shadowMap.needsUpdate = true;
    // in Gouache the creatures are drawn live on top every frame, so the painted world is rendered without them
    const limbVis = v => { creatures.forEach(c => { c.root.visible = v; c.legs.forEach(l => { l.leg.visible = v; l.foot.visible = v; }); }); hoppers.forEach(h => h.root.visible = v); drops.forEach(d => d.root.visible = v); scoots.forEach(d => d.root.visible = v); flits.forEach(d => d.root.visible = v); pips.forEach(d => d.root.visible = v); floaties.forEach(d => d.root.visible = v); allLimbs.forEach(m => m.visible = v); };
    if (gouache) limbVis(false);
    renderer.setRenderTarget(rtScene);
    renderer.render(scene, camera);
    if (gouache) limbVis(true);

    // keyline world: hide colour-only things, reveal smooth proxies
    colourOnly.forEach(o => o.visible = false); lineOnly.forEach(o => o.visible = true);
    scene.overrideMaterial = normalMat;
    const cc = renderer.getClearColor(new THREE.Color()), ca = renderer.getClearAlpha();
    renderer.setClearColor(0x8080ff, 1);
    renderer.setRenderTarget(rtNormal); renderer.clear(); renderer.render(scene, camera);
    renderer.setClearColor(cc, ca);
    scene.overrideMaterial = null;
    colourOnly.forEach(o => o.visible = true); lineOnly.forEach(o => o.visible = false);

    kuwaharaMat.uniforms.uRadius.value = Math.max(1, Math.min(8, Math.round((gouache ? G.brush : 4) * resScale)));
    kuwaharaMat.uniforms.uWarp.value = gouache ? G.wobble : 3;
    sepMat.uniforms.uLineMax.value = gouache ? G.lineWeight : 3.4;
    kuwaharaMat.uniforms.tDiffuse.value = rtScene.texture; pass(kuwaharaMat, rtPaint);
    edgeMat.uniforms.tNormal.value = rtNormal.texture; edgeMat.uniforms.tDepth.value = rtNormal.depthTexture; pass(edgeMat, rtEdge);
    sepMat.uniforms.tPaint.value = rtPaint.texture; sepMat.uniforms.tEdge.value = rtEdge.texture; sepMat.uniforms.uSolve.value = mode === 0 ? 1 : 0;
    pass(sepMat, rtSep);
  }
  // the fast part: the creatures (cheap, every frame in Gouache)
  function renderFolk() {
    const cc = renderer.getClearColor(new THREE.Color()), ca = renderer.getClearAlpha();
    [sky, sea, pool, foam, sun].forEach(o => o.visible = false);
    creatures.forEach(c => c.blob.visible = mode === 1); hoppers.forEach(h => h.blob.visible = mode === 1); drops.forEach(d => d.blob.visible = mode === 1); scoots.forEach(d => d.blob.visible = mode === 1); flits.forEach(d => d.blob.visible = mode === 1); pips.forEach(d => d.blob.visible = mode === 1); floaties.forEach(d => d.blob.visible = mode === 1);
    renderer.setRenderTarget(rtEyes); renderer.setClearColor(0x000000, 0); renderer.clear();
    // depth of the world only (the creatures sort themselves out in the next pass; their garments are cut shells)
    const folkVis = v => { creatures.forEach(c => { c.root.visible = v; c.legs.forEach(l => { l.leg.visible = v; l.foot.visible = v; }); }); [...hoppers, ...drops, ...scoots, ...flits, ...pips, ...floaties].forEach(h => h.root.visible = v); allLimbs.forEach(m => m.visible = v); };
    folkVis(false);
    scene.overrideMaterial = depthOnlyMat; renderer.render(scene, camera); scene.overrideMaterial = null;
    folkVis(true);
    camera.layers.set(FACE_LAYER); renderer.autoClear = false; renderer.render(scene, camera); renderer.autoClear = true; camera.layers.set(0);
    renderer.setClearColor(cc, ca);
    [sky, sea, pool, foam, sun].forEach(o => o.visible = true);
    if (mode === 1) {
      folkPaintMat.uniforms.tFolk.value = rtEyes.texture;
      folkPaintMat.uniforms.uRadius.value = Math.max(2, Math.min(5, Math.round(G.brush * 0.75 * resScale)));
      folkPaintMat.uniforms.uWarp.value = 1.5 + G.wobble * 0.5;
      pass(folkPaintMat, rtFolkPaint);
    }
    creatures.forEach(c => c.blob.visible = false); hoppers.forEach(h => h.blob.visible = false); drops.forEach(d => d.blob.visible = false); scoots.forEach(d => d.blob.visible = false); flits.forEach(d => d.blob.visible = false); pips.forEach(d => d.blob.visible = false); floaties.forEach(d => d.blob.visible = false);
  }
  function composite() {
    const u = printMat.uniforms;
    u.tSep.value = rtSep.texture; u.tPaint.value = rtPaint.texture; u.tEyes.value = mode === 1 ? rtFolkPaint.texture : rtEyes.texture; u.tMask.value = rtEyes.texture; u.uMode.value = mode;
    pass(printMat, null);
  }
  function renderPainted() { renderWorld(); renderFolk(); composite(); }


  setMode(/gouache/.test(location.hash) ? 1 : /raw/.test(location.hash) ? 2 : 0);
  if (/close/.test(location.hash)) { setCloseUp(true); closeT = 1; }
  resize();
  const clock = new THREE.Clock();
  let held = 0;
  const HOLD = 1 / 12;   // print editions run on held frames
  if (window.__STILL) window.__arch = { camera, creatures, hoppers, drops, scoots, flits, pips, floaties, renderPainted, updateCreatures, renderer, scene, get mode() { return mode; } };
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.1);
    const t = clock.elapsedTime * (reduceMotion ? 0.15 : 1);
    cur.lerp(aim, 1 - Math.pow(0.04, dt));
    held += dt;
    updateCreatures(dt * (reduceMotion ? 0.4 : 1), t);
    closeT += ((closeUp ? 1 : 0) - closeT) * Math.min(1, dt * 2.5);
    const ok = Math.min(1, dt * 8);
    orbit.yaw += (orbit.yawT - orbit.yaw) * ok; orbit.pitch += (orbit.pitchT - orbit.pitch) * ok; orbit.r += (orbit.rT - orbit.r) * ok;
    if (Math.abs((closeUp ? 1 : 0) - closeT) > 0.002) dirty = true;
    const hold = mode === 1 ? 1 / 24 : HOLD;   // Gouache repaints the world at 24fps; Riso keeps its 12fps print feel
    let drew = false;
    if (mode === 2 || held >= hold || dirty) {
      held = held % hold;
      const e = closeT * closeT * (3 - 2 * closeT);
      const farPos = V(camBase.x + cur.x * 1.6, camBase.y - cur.y * 0.6, camZ), farLook = V(lookBase.x + cur.x * 0.6, lookBase.y, lookBase.z);
      const cp = Math.cos(orbit.pitch);
      const nearPos = V(CLOSE_FOCUS.x + Math.sin(orbit.yaw) * orbit.r * cp, CLOSE_FOCUS.y + 0.35 + Math.sin(orbit.pitch) * orbit.r, CLOSE_FOCUS.z + Math.cos(orbit.yaw) * orbit.r * cp);
      camera.position.copy(farPos.lerp(nearPos, e));
      camera.lookAt(farLook.lerp(CLOSE_FOCUS, e));
      seaMat.uniforms.uTime.value = t; pool.material.uniforms.uTime.value = t;
      birds.forEach(b => {
        const u = b.userData, f = Math.sin(t * 4 * u.speed * 2 + u.phase);
        u.lw.rotation.y = 0; u.lw.rotation.z = f * 0.35; u.rw.rotation.z = -f * 0.35;
        b.position.x = u.x0 + Math.sin(t * 0.06 * u.speed + u.phase) * 5;
        b.position.y = u.y0 + Math.sin(t * 0.4 + u.phase) * 0.4;
      });
      people.forEach(p => { p.rotation.z = Math.sin(t * 0.6 + p.userData.phase) * 0.01; });
      if (mode === 2) { renderer.shadowMap.needsUpdate = true; renderer.setRenderTarget(null); renderer.render(scene, camera); }
      else if (mode === 1) renderWorld();
      else renderPainted();
      dirty = false; drew = true;
    }
    if (mode === 1) { renderFolk(); composite(); }   // creatures move at full frame rate
    if (window.__STILL && drew) return;
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
