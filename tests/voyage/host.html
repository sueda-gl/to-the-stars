<!doctype html>
<html><head><meta charset="utf-8"><title>Lounge host</title>
<style>html,body{margin:0;height:100%;background:#2e3a60;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head>
<body>
<!-- test host: ?src=<lounge url>. Exposes window.__driver -->
<iframe id="f"></iframe>
<script type="module">
import { createLoungeDriver } from '/web/js/voyage/lounge-driver.js';
const f = document.getElementById('f');
f.src = new URLSearchParams(location.search).get('src') || '/web/worlds/lounge.html';
window.__driver = createLoungeDriver(f, { log: (...a) => console.log('[driver]', ...a) });
</script>
</body></html>
